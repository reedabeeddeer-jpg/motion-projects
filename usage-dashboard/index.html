<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Usage Overview</title>
<style>
:root{
  --bg:#1f1e1d; --panel:#262624; --card:#30302e; --card-border:#3a3a37;
  --text:#f5f4ef; --muted:#9a9890; --cell:#3b3b38; --cell-hi:#8fd0ff;
  --accent:#d97757;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 16px 32px}
h1{font-size:28px;font-weight:500;margin-bottom:32px;font-family:Georgia,serif}
.wrap{width:100%;max-width:760px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{padding:6px 14px;border-radius:8px;font-size:14px;color:var(--muted);background:none;border:0;cursor:pointer;font:inherit}
.tab.on{background:var(--card);color:var(--text)}
.panel{background:var(--panel);border:1px solid var(--card-border);border-radius:16px;padding:16px}
.range{display:flex;justify-content:flex-end;gap:4px;margin-bottom:10px}
.range button{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;padding:3px 10px;border-radius:6px;cursor:pointer}
.range button.on{background:var(--card);color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
.stat b{font-size:22px;font-weight:600}
.stat b.sm{font-size:16px;font-weight:500}
.heat{display:grid;grid-template-columns:repeat(26,1fr);gap:4px;margin:18px 0 14px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--cell)}
.heat i.l1{background:#4a5d6b}.heat i.l2{background:#6aa6cf}.heat i.l3{background:var(--cell-hi)}
.note{color:var(--muted);font-size:13px}
.composer{width:100%;max-width:760px;margin-top:28px}
.chips{display:flex;gap:8px;margin-bottom:10px}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--card-border);
  border-radius:8px;padding:6px 12px;font-size:14px}
.box{border:1px solid var(--card-border);border-radius:14px;background:var(--panel);padding:16px 16px 10px}
.box p{color:var(--muted);font-size:16px;margin-bottom:22px}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
.bar span+span{margin-left:12px}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.heat{grid-template-columns:repeat(18,1fr)}}
</style>
</head>
<body>
<h1>What's up next?</h1>
<div class="wrap">
  <div class="tabs" id="tabs">
    <button class="tab on">Overview</button><button class="tab">Models</button>
  </div>
  <div class="panel">
    <div class="range" id="range"><button class="on">All</button><button>30d</button><button>7d</button></div>
    <div class="stats">
      <div class="stat"><small>Sessions</small><b id="sessions">3</b></div>
      <div class="stat"><small>Messages</small><b id="messages">206</b></div>
      <div class="stat"><small>Total tokens</small><b id="tokens">229.6k</b></div>
      <div class="stat"><small>Active days</small><b id="days">3</b></div>
      <div class="stat"><small>Peak hour</small><b id="peak">6 PM</b></div>
      <div class="stat"><small>Favorite model</small><b class="sm" id="model">Opus 4.7</b></div>
    </div>
    <div class="heat" id="heat"></div>
    <p class="note" id="note">You've used ~5× more tokens than Animal Farm.</p>
  </div>
</div>
<div class="composer">
  <div class="chips">
    <div class="chip">▭ Local</div><div class="chip">🗀 n8n</div><div class="chip">⧉</div>
  </div>
  <div class="box">
    <p>Describe a task or ask a question</p>
    <div class="bar"><div><span>＋</span><span>🎙</span><span>⌄</span><span>Auto</span></div><div>Opus 5.5 &nbsp; Medium</div></div>
  </div>
</div>
<script>
// 7 rows x 26 weeks heatmap; highlighted cells = active days
const heat=document.getElementById('heat'), rows=7, cols=26;
const hot={ '0,6':3, '3,5':3 };           // row,col -> level (matches the reference)
const warm={ '3,4':1,'2,4':1,'3,6':1,'1,6':1 };
for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const i=document.createElement('i'),k=r+','+c;
  const lv=hot[k]||warm[k]; if(lv)i.className='l'+lv; heat.appendChild(i);
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');});
document.querySelectorAll('#range button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#range button').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
</script>
</body>
</html>
