<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Quran Competition</title>
<style>
  @font-face { font-family: Amiri; font-weight: 400; src: url(../assets/fonts/amiri-arabic-400-normal.woff2) format("woff2"); }
  @font-face { font-family: Amiri; font-weight: 700; src: url(../assets/fonts/amiri-arabic-700-normal.woff2) format("woff2"); }
  @font-face { font-family: Cairo; font-weight: 400; src: url(../assets/fonts/cairo-arabic-400-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Cairo; font-weight: 700; src: url(../assets/fonts/cairo-arabic-700-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Cairo; font-weight: 900; src: url(../assets/fonts/cairo-arabic-900-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  html, body { margin: 0; background: #04221F; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
<script src="quran-envelope.js"></script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<audio id="voice" src="../assets/audio/quran-voice.mp3"></audio>
<script>
const W = 1920, H = 1080, CX = W / 2, CY = H / 2;
const DURATION = 20, FPS = 30;
const C = {
  cream: "#FFF8E7", gold: "#E8C26A", goldLight: "#FFE9A8", goldDeep: "#B8862F",
  emerald: "#04332B", teal: "#0B5D57", navy: "#0A1E3F",
};
const ctx = document.getElementById("c").getContext("2d");

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, start, dur) => clamp((t - start) / dur);
const lerp = (a, b, k) => a + (b - a) * k;
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const eInCubic = k => k * k * k;
const eOutBack = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const env = t => { const e = window.VOICE_ENV || []; return e[Math.min(e.length - 1, Math.max(0, Math.floor(t * FPS)))] || 0; };
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function mixHex(a, b, k) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [p(a), p(b)];
  return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], k))).join(",")})`;
}
function goldFill(y, size) {
  const g = ctx.createLinearGradient(0, y - size * 0.6, 0, y + size * 0.6);
  g.addColorStop(0, "#FFF4C9"); g.addColorStop(0.45, C.gold); g.addColorStop(1, C.goldDeep);
  return g;
}
function star8(x, y, r, rot = 0) { // two overlapping squares
  ctx.beginPath();
  for (let i = 0; i < 16; i++) {
    const a = rot + (i * Math.PI) / 8, rr = i % 2 ? r * 0.76 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}

// ---------- background ----------
const particles = (() => {
  const r = rng(11); const out = [];
  for (let i = 0; i < 90; i++) out.push({ x: r() * W, y: r() * H, s: 0.8 + r() * 2.6, v: 10 + r() * 30, p: r() * 6.28, d: r() });
  return out;
})();

function drawBackground(t, e) {
  // drifting multi-stop gradient
  const a = t * 0.12;
  const gx = Math.cos(a) * W * 0.6, gy = Math.sin(a) * H * 0.6;
  const g = ctx.createLinearGradient(CX - gx, CY - gy, CX + gx, CY + gy);
  const k = (Math.sin(t * 0.35) + 1) / 2;
  g.addColorStop(0, mixHex(C.emerald, C.navy, k));
  g.addColorStop(0.5, mixHex(C.teal, "#0E4A5C", k));
  g.addColorStop(1, mixHex(C.navy, "#062B26", k));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // breathing center glow follows the voice
  const rg = ctx.createRadialGradient(CX, CY, 0, CX, CY, 900);
  rg.addColorStop(0, `rgba(232,194,106,${0.10 + e * 0.12})`);
  rg.addColorStop(0.45, "rgba(232,194,106,0.03)");
  rg.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);

  // geometric star lattice
  ctx.save();
  ctx.strokeStyle = "rgba(232,194,106,0.07)";
  ctx.lineWidth = 1.2;
  const sp = 150, ox = (t * 12) % sp, oy = (t * 6) % sp;
  for (let y = -sp; y < H + sp; y += sp)
    for (let x = -sp; x < W + sp; x += sp) {
      star8(x + ox, y + oy, 52, Math.PI / 8); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + ox + sp / 2, y + oy + sp / 2, 8, 0, 6.28); ctx.stroke();
    }
  ctx.restore();

  // central rotating rosette
  ctx.save();
  ctx.translate(CX, CY);
  ctx.scale(1 + e * 0.05, 1 + e * 0.05);
  ctx.lineWidth = 1.6;
  for (let i = 0; i < 4; i++) {
    ctx.strokeStyle = `rgba(232,194,106,${0.13 - i * 0.025})`;
    star8(0, 0, 300 + i * 95, t * (i % 2 ? -0.06 : 0.08));
    ctx.stroke();
  }
  ctx.setLineDash([4, 14]);
  ctx.strokeStyle = "rgba(255,233,168,0.18)";
  ctx.beginPath(); ctx.arc(0, 0, 250, t * 0.3, t * 0.3 + 6.28); ctx.stroke();
  ctx.restore();

  // rising gold dust
  for (const p of particles) {
    const y = ((p.y - t * p.v) % H + H) % H;
    const x = p.x + Math.sin(t * 0.6 + p.p) * 20;
    const tw = 0.35 + 0.65 * (Math.sin(t * 2 + p.p) + 1) / 2;
    ctx.fillStyle = `rgba(255,228,160,${(0.18 + p.d * 0.4) * tw})`;
    ctx.beginPath(); ctx.arc(x, y, p.s * (1 + e * 0.5), 0, 6.28); ctx.fill();
  }

  // vignette
  const vg = ctx.createRadialGradient(CX, CY, 400, CX, CY, 1150);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.55)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function drawFrame(t) {
  const k = eOutCubic(prog(t, 0.1, 1.2));
  const m = 48;
  ctx.save();
  ctx.globalAlpha = k;
  ctx.strokeStyle = "rgba(232,194,106,0.55)";
  ctx.lineWidth = 2;
  const w = (W - 2 * m) * k, h = (H - 2 * m) * k;
  ctx.strokeRect(CX - w / 2, CY - h / 2, w, h);
  ctx.strokeStyle = "rgba(232,194,106,0.25)";
  ctx.strokeRect(CX - w / 2 + 12, CY - h / 2 + 12, w - 24, h - 24);
  for (const [x, y] of [[m, m], [W - m, m], [m, H - m], [W - m, H - m]]) {
    ctx.fillStyle = C.gold;
    star8(x, y, 18, t * 0.5); ctx.fill();
    ctx.fillStyle = C.emerald;
    ctx.beginPath(); ctx.arc(x, y, 6, 0, 6.28); ctx.fill();
  }
  ctx.restore();
}

function drawWaveform(t, e) {
  const n = 56, bw = 7, gap = 7, base = H - 120;
  const a = eOutCubic(prog(t, 0.2, 0.8));
  ctx.save();
  ctx.globalAlpha = 0.85 * a;
  for (let i = 0; i < n; i++) {
    const d = Math.abs(i - (n - 1) / 2) / (n / 2);
    const wob = 0.45 + 0.55 * Math.abs(Math.sin(t * 9 + i * 1.7) * Math.cos(t * 5.3 + i * 0.6));
    const h = 4 + e * 70 * wob * (1 - d * 0.7);
    const x = CX + (i - n / 2) * (bw + gap);
    ctx.fillStyle = goldFill(base, 60);
    ctx.beginPath(); ctx.roundRect(x, base - h, bw, h * 2, 3.5); ctx.fill();
  }
  ctx.restore();
}

// ---------- synced text ----------
// word start times are ElevenLabs Scribe timestamps of assets/audio/quran-voice.mp3
const SCENES = [
  { start: 0.0, end: 2.95, lines: [
    { y: 450, font: "700 132px Amiri", gold: true, words: [["أهلُ", 0.04], ["القرآنِ", 0.26]] },
    { y: 640, font: "700 132px Amiri", words: [["هم", 1.14], ["أهلُ", 1.42], ["اللهِ", 1.74], ["وخاصّتُه", 2.2]] },
  ] },
  { start: 2.95, end: 6.45, lines: [
    { y: 330, font: "700 62px Cairo", words: [["ندعوكم", 3.04], ["للمشاركةِ", 3.48], ["في", 4.16]] },
    { y: 520, font: "700 150px Amiri", gold: true, words: [["مسابقةِ", 4.28], ["القرآنِ", 4.8], ["الكريمِ", 5.26]] },
    { y: 720, font: "900 72px Cairo", ribbon: true, words: [["الكبرى", 5.68]] },
  ] },
  { start: 6.45, end: 9.15, cards: [["حفظاً", 6.66, "١"], ["تلاوةً", 7.32, "٢"], ["تجويداً", 8.3, "٣"]] },
  { start: 9.15, end: 11.8, trophy: 9.1, lines: [
    { y: 620, font: "700 120px Amiri", gold: true, words: [["بجوائزَ", 9.26], ["قيّمةٍ", 9.9]] },
    { y: 790, font: "700 70px Cairo", words: [["للمتميّزين", 10.8]] },
  ] },
  { start: 11.8, end: 13.4, lines: [
    { y: 440, font: "900 120px Cairo", words: [["سارعوا", 11.94], ["بالتسجيلِ", 12.34]] },
    { y: 650, font: "900 96px Cairo", button: true, words: [["الآن", 12.92]] },
  ] },
  { start: 13.4, end: 20.5, quote: true, lines: [
    { y: 230, font: "700 70px Amiri", words: [["قال", 13.48], ["رسولُ", 13.72], ["اللهِ", 14.06]] },
    { y: 335, font: "700 70px Amiri", gold: true, words: [["صلّى", 14.38], ["اللهُ", 14.62], ["عليهِ", 15.0], ["وآلِهِ", 15.38], ["وسلّم", 15.9]] },
    { y: 580, font: "700 140px Amiri", gold: true, words: [["خيرُكم", 16.6], ["مَن", 17.22], ["تعلّمَ", 17.46]] },
    { y: 770, font: "700 140px Amiri", gold: true, words: [["القرآنَ", 17.98], ["وعلّمَه", 18.86]] },
  ] },
];
// each word stays "active" (highlighted) until the next word starts
const ALL_WORDS = SCENES.flatMap(s => (s.lines || []).flatMap(l => l.words).concat((s.cards || []).map(c => [c[0], c[1]])))
  .map(w => w[1]).sort((a, b) => a - b);
const nextStart = ws => ALL_WORDS.find(x => x > ws + 0.01) ?? DURATION;

function sceneOut(s, t) {
  return s.end >= DURATION ? 0 : eInCubic(prog(t, s.end - 0.4, 0.4));
}
// position + opacity entrance: slides in from the right (reading direction) and from below
const SLIDE_X = 90, SLIDE_Y = 36;
function enter(t, start, dur = 0.6) {
  const p = prog(t, start, dur);
  const k = eOutCubic(p);
  return { p, alpha: clamp(p * 1.6), dx: (1 - k) * SLIDE_X, dy: (1 - k) * SLIDE_Y };
}

function drawLine(line, t, e, sa) {
  ctx.save();
  ctx.font = line.font;
  ctx.direction = "rtl";
  ctx.textBaseline = "middle";
  const size = parseInt(line.font.split(" ")[1]);
  const space = Math.max(ctx.measureText(" ").width * 1.15, size * 0.38);
  const widths = line.words.map(([w]) => ctx.measureText(w).width);
  const total = widths.reduce((a, b) => a + b, 0) + space * (widths.length - 1);
  let x = CX + total / 2;

  if (line.ribbon || line.button) {
    const en = enter(t, line.words[0][1] - 0.1);
    const pw = total + size * 1.3, ph = size * 1.45;
    ctx.save();
    ctx.translate(en.dx, en.dy);
    ctx.globalAlpha *= sa * en.alpha;
    ctx.shadowColor = "rgba(232,194,106,0.6)"; ctx.shadowBlur = 30 + e * 30;
    ctx.fillStyle = goldFill(line.y, size);
    ctx.beginPath(); ctx.roundRect(CX - pw / 2, line.y - ph / 2, pw, ph, ph / 2); ctx.fill();
    ctx.restore();
  }

  line.words.forEach(([word, ws], i) => {
    const w = widths[i];
    const en = enter(t, ws - 0.04);
    if (en.p <= 0) { x -= w + space; return; }
    const pill = line.ribbon || line.button;
    const active = t >= ws && t < nextStart(ws);
    const hot = active ? 1 : 1 - prog(t, nextStart(ws), 0.3);
    const cx = x - w / 2;
    ctx.save();
    ctx.globalAlpha = sa * en.alpha * (line.muted ? 0.85 : 1);
    ctx.translate(cx + (pill ? enter(t, line.words[0][1] - 0.1).dx : en.dx),
                  line.y + (pill ? enter(t, line.words[0][1] - 0.1).dy : en.dy) - hot * e * 8);
    ctx.textAlign = "center";
    if (line.ribbon || line.button) {
      ctx.fillStyle = C.emerald;
    } else if (line.gold) {
      ctx.shadowColor = `rgba(255,214,120,${0.35 + hot * 0.5})`;
      ctx.shadowBlur = 18 + hot * 30 * (0.5 + e);
      ctx.fillStyle = goldFill(0, size);
    } else {
      ctx.shadowColor = `rgba(255,214,120,${hot * 0.7})`;
      ctx.shadowBlur = hot * 30;
      ctx.fillStyle = mixHex(line.muted ? "#E9DFC6" : C.cream, C.goldLight, hot);
    }
    ctx.fillText(word, 0, 0);
    ctx.restore();
    x -= w + space;
  });
  ctx.restore();
}

function drawDivider(y, t, start, sa, width = 520) {
  const k = eOutCubic(prog(t, start, 0.8));
  if (k <= 0) return;
  ctx.save();
  ctx.globalAlpha = sa;
  const g = ctx.createLinearGradient(CX - width / 2, 0, CX + width / 2, 0);
  g.addColorStop(0, "rgba(232,194,106,0)"); g.addColorStop(0.5, C.gold); g.addColorStop(1, "rgba(232,194,106,0)");
  ctx.strokeStyle = g; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(CX - width / 2 * k, y); ctx.lineTo(CX + width / 2 * k, y); ctx.stroke();
  ctx.fillStyle = C.gold;
  star8(CX, y, 13 * k, t); ctx.fill();
  ctx.restore();
}

function drawCards(s, t, e, sa) {
  // section label (not spoken)
  const le = enter(t, s.start);
  ctx.save();
  ctx.globalAlpha = sa * le.alpha;
  ctx.translate(le.dx, 0);
  ctx.font = "700 58px Cairo"; ctx.direction = "rtl"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = C.cream;
  ctx.fillText("مجالات المسابقة", CX, 250 + le.dy);
  ctx.restore();
  drawDivider(310, t, s.start + 0.1, sa, 420);

  const cw = 440, ch = 460, gap = 70;
  s.cards.forEach(([label, ws, num], i) => {
    const x = CX + (1 - i) * (cw + gap); // right to left
    const en = enter(t, ws - 0.1, 0.7);
    if (en.p <= 0) return;
    const active = t >= ws && t < nextStart(ws);
    const hot = active ? 1 : 1 - prog(t, nextStart(ws), 0.3);
    ctx.save();
    ctx.globalAlpha = sa * en.alpha;
    ctx.translate(x + en.dx, 640 + en.dy * 3 - hot * e * 10);
    // card
    ctx.shadowColor = `rgba(232,194,106,${0.15 + hot * 0.45})`; ctx.shadowBlur = 40;
    ctx.fillStyle = "rgba(4,40,36,0.72)";
    ctx.beginPath(); ctx.roundRect(-cw / 2, -ch / 2, cw, ch, 36); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = mixHex(C.goldDeep, C.goldLight, hot); ctx.lineWidth = 3;
    ctx.stroke();
    // number badge
    ctx.fillStyle = goldFill(-90, 120);
    star8(0, -90, 92, t * 0.4 + i); ctx.fill();
    ctx.fillStyle = C.emerald;
    ctx.font = "900 86px Cairo"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.direction = "rtl";
    ctx.fillText(num, 0, -84);
    // label
    ctx.font = "700 92px Amiri";
    ctx.shadowColor = `rgba(255,214,120,${hot * 0.8})`; ctx.shadowBlur = hot * 30;
    ctx.fillStyle = mixHex(C.cream, C.goldLight, hot);
    ctx.fillText(label, 0, 115);
    ctx.restore();
  });
}

function drawTrophy(t, start, e, sa) {
  const en = enter(t, start, 0.8);
  if (en.p <= 0) return;
  ctx.save();
  ctx.globalAlpha = sa * en.alpha;
  ctx.translate(CX, 330 - en.dy * 3 - e * 10);
  // rays
  ctx.save();
  ctx.rotate(t * 0.4);
  for (let i = 0; i < 16; i++) {
    ctx.rotate(Math.PI / 8);
    const g = ctx.createLinearGradient(0, 0, 0, -230);
    g.addColorStop(0, "rgba(255,228,160,0.35)"); g.addColorStop(1, "rgba(255,228,160,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(0, -230); ctx.lineTo(12, 0); ctx.fill();
  }
  ctx.restore();
  ctx.shadowColor = "rgba(255,214,120,0.7)"; ctx.shadowBlur = 40;
  ctx.fillStyle = goldFill(0, 160);
  ctx.strokeStyle = goldFill(0, 160); ctx.lineWidth = 14;
  // handles
  ctx.beginPath(); ctx.arc(-78, -40, 38, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(78, -40, 38, -Math.PI * 0.5, Math.PI * 0.5); ctx.stroke();
  // cup
  ctx.beginPath();
  ctx.moveTo(-85, -95); ctx.lineTo(85, -95);
  ctx.bezierCurveTo(85, 10, 40, 40, 14, 48);
  ctx.lineTo(14, 80); ctx.lineTo(-14, 80); ctx.lineTo(-14, 48);
  ctx.bezierCurveTo(-40, 40, -85, 10, -85, -95);
  ctx.fill();
  ctx.beginPath(); ctx.roundRect(-60, 78, 120, 22, 6); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-80, 98, 160, 26, 8); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = C.emerald;
  star8(0, -35, 30, t); ctx.fill();
  ctx.restore();
}

function drawScene(s, t, e) {
  if (t < s.start - 0.05 || t > s.end) return;
  const out = sceneOut(s, t);
  const sa = 1 - out;
  ctx.save();
  ctx.translate(0, -out * 70);
  if (s.cards) drawCards(s, t, e, sa);
  if (s.trophy) drawTrophy(t, s.trophy, e, sa);
  for (const line of s.lines || []) drawLine(line, t, e, sa);
  if (s === SCENES[0]) drawDivider(790, t, 1.4, sa, 560);
  if (s === SCENES[1]) drawDivider(410, t, 4.2, sa, 640);
  if (s.quote) {
    drawDivider(445, t, 16.2, sa, 520);
    // light sweep across the final verse
    const p = prog(t, 19.5, 0.5);
    if (p > 0 && p < 1) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.translate(lerp(W + 300, -300, p), 675);
      ctx.scale(0.6, 1.4);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 260);
      g.addColorStop(0, "rgba(255,240,200,0.16)"); g.addColorStop(1, "rgba(255,240,200,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 260, 0, 6.28); ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
}

// scene-change flash: a thin gold line sweeping out from the center
function drawTransitions(t) {
  for (const s of SCENES.slice(1)) {
    const p = prog(t, s.start - 0.15, 0.5);
    if (p <= 0 || p >= 1) continue;
    ctx.save();
    ctx.globalAlpha = Math.sin(p * Math.PI) * 0.7;
    const w = W * eOutCubic(p);
    const g = ctx.createLinearGradient(CX - w / 2, 0, CX + w / 2, 0);
    g.addColorStop(0, "rgba(255,228,160,0)"); g.addColorStop(0.5, "rgba(255,240,200,1)"); g.addColorStop(1, "rgba(255,228,160,0)");
    ctx.fillStyle = g; ctx.fillRect(CX - w / 2, CY - 1.5, w, 3);
    ctx.restore();
  }
}

function render(t) {
  const e = env(t);
  ctx.save();
  drawBackground(t, e);
  drawFrame(t);
  for (const s of SCENES) drawScene(s, t, e);
  drawTransitions(t);
  drawWaveform(t, e);
  const fadeIn = 1 - prog(t, 0, 0.4);
  if (fadeIn > 0) { ctx.fillStyle = `rgba(0,0,0,${fadeIn})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

window.DURATION = DURATION;
window.render = render;
window.ready = Promise.all([
  document.fonts.load("700 50px Amiri", "القرآن"), document.fonts.load("400 50px Amiri", "القرآن ﷺ"),
  document.fonts.load("700 50px Cairo", "مسابقة"), document.fonts.load("900 50px Cairo", "مسابقة"),
]).then(() => true);

// live preview with voice when opened directly in a browser (click to start)
if (!navigator.webdriver) {
  const audio = document.getElementById("voice");
  window.ready.then(() => {
    render(0);
    document.body.addEventListener("click", () => { audio.currentTime = 0; audio.play(); });
    const loop = () => { render(audio.paused ? 0 : audio.currentTime); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
