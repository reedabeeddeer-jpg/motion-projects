<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قنوات بي إن سبورتس</title>
<style>
  @font-face { font-family: Cairo; font-weight: 400; src: url(../assets/fonts/cairo-arabic-400-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Cairo; font-weight: 700; src: url(../assets/fonts/cairo-arabic-700-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Cairo; font-weight: 900; src: url(../assets/fonts/cairo-arabic-900-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Cairo; font-weight: 400; src: url(../assets/fonts/cairo-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2022; }
  @font-face { font-family: Cairo; font-weight: 700; src: url(../assets/fonts/cairo-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2022; }
  @font-face { font-family: Cairo; font-weight: 900; src: url(../assets/fonts/cairo-latin-900-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2022; }
  html, body { margin: 0; background: #12061F; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, CX = W / 2, CY = H / 2;
const DURATION = 34;
// the voice-over track starts at VO_AT; every cue below is "VO time + VO_AT"
const VO_AT = 0.6;
const v = s => s + VO_AT;
const C = {
  bg: "#12061F", deep: "#1E0B33", purple: "#5E2B97", violet: "#8B4DD8", magenta: "#D63AF9",
  white: "#F8F5FF", muted: "#B3A3CC", gold: "#FFC93C", card: "rgba(30,11,51,0.88)",
};
const ctx = document.getElementById("c").getContext("2d");

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, start, dur) => clamp((t - start) / dur);
const lerp = (a, b, k) => a + (b - a) * k;
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const eInCubic = k => k * k * k;
const eInOutCubic = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eOutExpo = k => k === 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const font = (w, s) => `${w} ${s}px Cairo`;
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function text(str, x, y, o = {}) {
  ctx.save();
  ctx.direction = o.dir || "rtl";
  ctx.font = o.font || font(700, 60);
  ctx.textAlign = o.align || "center";
  ctx.textBaseline = "middle";
  ctx.globalAlpha *= o.alpha ?? 1;
  if (o.spacing) ctx.letterSpacing = `${o.spacing}px`;
  if (o.shadow) { ctx.shadowColor = o.shadow; ctx.shadowBlur = o.blur ?? 40; }
  if (o.grad) {
    const m = ctx.measureText(str).width;
    const g = ctx.createLinearGradient(x - m / 2, 0, x + m / 2, 0);
    o.grad.forEach((c, i) => g.addColorStop(i / (o.grad.length - 1), c));
    ctx.fillStyle = g;
  } else ctx.fillStyle = o.color || C.white;
  ctx.fillText(str, x, y);
  ctx.restore();
}

// text revealed upward from behind a clip line
function riseText(str, x, y, k, size, o = {}) {
  if (k <= 0) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, y - size * 0.8, W, size * 1.6); ctx.clip();
  text(str, x, y + (1 - k) * size * 1.4, { font: font(o.weight || 900, size), ...o });
  ctx.restore();
}

// ---------- background ----------
const dots = (() => { const r = rng(9), out = []; for (let i = 0; i < 90; i++) out.push({ x: r() * W, y: r() * H, s: 1 + r() * 2.4, v: 6 + r() * 22, p: r() * 6.3 }); return out; })();

function drawBackground(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // two drifting colour blobs
  [[CX + Math.sin(t * 0.3) * 400, CY + Math.cos(t * 0.25) * 200, C.purple, 900],
   [CX - Math.cos(t * 0.22) * 500, CY + Math.sin(t * 0.35) * 260, "#7A1FA2", 700]].forEach(([x, y, c, r]) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, c + "66"); g.addColorStop(1, c + "00");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  });
  // diagonal speed lines
  ctx.save();
  ctx.translate(CX, CY); ctx.rotate(-0.35);
  for (let i = 0; i < 14; i++) {
    const y = -900 + i * 135;
    const x = ((t * (120 + i * 17) + i * 300) % 3200) - 1600;
    const g = ctx.createLinearGradient(x - 500, 0, x, 0);
    g.addColorStop(0, "rgba(214,58,249,0)"); g.addColorStop(1, "rgba(214,58,249,0.10)");
    ctx.fillStyle = g; ctx.fillRect(x - 500, y, 500, 3);
  }
  ctx.restore();
  // dot grid
  ctx.fillStyle = "rgba(248,245,255,0.05)";
  for (let x = 40; x < W; x += 80) for (let y = 40; y < H; y += 80) { ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill(); }
  for (const p of dots) {
    const y = (p.y - t * p.v + H * 10) % H;
    ctx.fillStyle = `rgba(248,245,255,${0.1 + 0.15 * Math.sin(t * 1.4 + p.p)})`;
    ctx.beginPath(); ctx.arc(p.x, y, p.s, 0, Math.PI * 2); ctx.fill();
  }
  const vg = ctx.createRadialGradient(CX, CY, 400, CX, CY, 1150);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.6)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function shockwave(t, start, color, cx = CX, cy = CY, maxR = 700, dur = 1.0, width = 8) {
  const k = prog(t, start, dur);
  if (k <= 0 || k >= 1) return;
  ctx.save();
  ctx.strokeStyle = color; ctx.globalAlpha = 1 - k; ctx.lineWidth = width * (1 - k) + 1;
  ctx.beginPath(); ctx.arc(cx, cy, eOutCubic(k) * maxR, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// slanted panel wipe between scenes
function slashWipe(t, start) {
  const cols = [C.magenta, C.violet, C.deep];
  cols.forEach((c, i) => {
    const kin = eInOutCubic(prog(t, start + i * 0.06, 0.4));
    const kout = eInOutCubic(prog(t, start + 0.42 + i * 0.06, 0.4));
    if (kin <= 0 || kout >= 1) return;
    const span = W + 700;
    const a = W + 350 - span * kin, b = W + 350 - span * kout; // moves right -> left
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(a, 0); ctx.lineTo(b, 0); ctx.lineTo(b - 350, H); ctx.lineTo(a - 350, H);
    ctx.closePath(); ctx.fill();
  });
}

// ---------- icons ----------
function icon(type, x, y, s, t, color = C.white) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (type === "trophy") {
    ctx.beginPath(); ctx.moveTo(-34, -50); ctx.lineTo(34, -50); ctx.quadraticCurveTo(34, 10, 0, 18); ctx.quadraticCurveTo(-34, 10, -34, -50); ctx.fill();
    ctx.beginPath(); ctx.arc(-34, -28, 16, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(34, -28, 16, -Math.PI * 0.5, Math.PI * 0.5); ctx.stroke();
    ctx.fillRect(-6, 16, 12, 22); roundRect(-28, 36, 56, 14, 4); ctx.fill();
  } else if (type === "stars") {
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + t * 0.5;
      star(Math.cos(a) * 44, Math.sin(a) * 44, 10);
    }
    ball(0, 0, 24, t * 2);
  } else if (type === "crown") {
    ctx.beginPath(); ctx.moveTo(-44, 30); ctx.lineTo(-48, -26); ctx.lineTo(-20, 0); ctx.lineTo(0, -40); ctx.lineTo(20, 0); ctx.lineTo(48, -26); ctx.lineTo(44, 30); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.bg; [-24, 0, 24].forEach(cx => { ctx.beginPath(); ctx.arc(cx, 16, 6, 0, Math.PI * 2); ctx.fill(); });
  } else if (type === "sun") {
    ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(t * 0.8);
    for (let i = 0; i < 10; i++) { ctx.rotate(Math.PI / 5); ctx.beginPath(); ctx.moveTo(0, 34); ctx.lineTo(0, 48); ctx.stroke(); }
  } else if (type === "mic") {
    roundRect(-18, -50, 36, 66, 18); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -4, 34, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(0, 48); ctx.moveTo(-20, 48); ctx.lineTo(20, 48); ctx.stroke();
  }
  ctx.restore();
}

function star(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? r * 0.45 : r;
    ctx[i ? "lineTo" : "moveTo"](x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
}

function ball(x, y, r, rot = 0) {
  ctx.save();
  ctx.translate(x, y);
  const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
  g.addColorStop(0, "#FFFFFF"); g.addColorStop(1, "#CFCAD8");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip(); ctx.rotate(rot);
  ctx.fillStyle = "#1A1225";
  const pent = (px, py, s) => { ctx.beginPath(); for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5; ctx[i ? "lineTo" : "moveTo"](px + Math.cos(a) * s, py + Math.sin(a) * s); } ctx.closePath(); ctx.fill(); };
  pent(0, 0, r * 0.36);
  for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5 + Math.PI / 5; pent(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.95, r * 0.3); }
  ctx.restore(); ctx.restore();
}

// sport balls for scene 4
function sportBall(type, x, y, r, rot) {
  if (type === "football") return ball(x, y, r, rot);
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  const base = { tennis: ["#E8F55A", "#B7C92B"], basket: ["#FF9A3C", "#D2621B"], hand: ["#4FA3FF", "#1F5FC4"] }[type];
  const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
  g.addColorStop(0, base[0]); g.addColorStop(1, base[1]);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
  ctx.lineWidth = r * 0.07; ctx.lineCap = "round";
  if (type === "tennis") {
    ctx.strokeStyle = "#FFFFFF";
    ctx.beginPath(); ctx.arc(-r * 1.25, 0, r * 0.95, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(r * 1.25, 0, r * 0.95, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
  } else if (type === "basket") {
    ctx.strokeStyle = "#3A1A08";
    ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
    ctx.beginPath(); ctx.arc(-r * 1.15, 0, r * 0.85, -1, 1); ctx.stroke();
    ctx.beginPath(); ctx.arc(r * 1.15, 0, r * 0.85, Math.PI - 1, Math.PI + 1); ctx.stroke();
  } else {
    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(0, 0, r * (0.35 + i * 0.3), r, 0, 0, Math.PI * 2); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
  }
  ctx.restore(); ctx.restore();
}

// ---------- scene 1: name reveal (0 - 3.6) ----------
function scene1(t) {
  if (t > 3.8) return;
  const exit = eInCubic(prog(t, 3.2, 0.4));
  shockwave(t, 0.5, C.magenta, CX, CY, 900, 1.1, 10);
  shockwave(t, 0.65, C.white, CX, CY, 1000, 1.2, 4);
  ctx.save();
  ctx.globalAlpha = 1 - exit;
  ctx.translate(CX, CY); ctx.scale(1 + exit * 0.3, 1 + exit * 0.3); ctx.translate(-CX, -CY);

  // rotating ring of segments
  const kr = eOutCubic(prog(t, 0.2, 1.0));
  ctx.save(); ctx.translate(CX, CY - 40); ctx.rotate(t * 0.5);
  ctx.lineWidth = 10; ctx.lineCap = "round";
  for (let i = 0; i < 6; i++) {
    ctx.strokeStyle = i % 2 ? C.violet : C.magenta;
    const a0 = (i / 6) * Math.PI * 2;
    ctx.beginPath(); ctx.arc(0, 0, 540, a0, a0 + (Math.PI / 3 - 0.18) * kr); ctx.stroke();
  }
  ctx.restore();

  // latin wordmark (plain typography, not the official logo)
  const kL = eOutExpo(prog(t, v(0), 0.8));
  ctx.save(); ctx.beginPath(); ctx.rect(0, CY - 200, W, 200); ctx.clip();
  text("beIN SPORTS", CX, CY - 90 + (1 - kL) * 200, { font: font(900, 150), dir: "ltr", grad: [C.white, "#E6C9FF"], spacing: 4 });
  ctx.restore();
  const kU = eOutCubic(prog(t, v(0.6), 0.6));
  ctx.fillStyle = C.magenta; roundRect(CX - 420 * kU, CY + 5, 840 * kU, 8, 4); ctx.fill();
  riseText("وجهة الرياضة العربية", CX, CY + 90, eOutExpo(prog(t, v(1.2), 0.8)), 76, { color: C.gold });
  ctx.restore();
}

// ---------- scene 2: about (3.6 - 9.6) ----------
function scene2(t) {
  if (t < 3.5 || t > 10) return;
  const exit = eInCubic(prog(t, 9.4, 0.4));
  ctx.save();
  ctx.globalAlpha = 1 - exit;
  ctx.translate(-exit * 300, 0);

  // left: stylised globe with a pin on Doha
  const kg = eOutBack(prog(t, 3.7, 0.8));
  const gx = CX - 610, gy = CY + 10, gr = 230 * kg;
  if (kg > 0) {
    ctx.save();
    ctx.beginPath(); ctx.arc(gx, gy, gr, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(gx - gr * 0.3, gy - gr * 0.3, 10, gx, gy, gr);
    g.addColorStop(0, "#3A1A5E"); g.addColorStop(1, "#1A0A2E");
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = "rgba(214,58,249,0.6)"; ctx.lineWidth = 3; ctx.stroke();
    ctx.clip();
    ctx.strokeStyle = "rgba(248,245,255,0.14)"; ctx.lineWidth = 2;
    for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.ellipse(gx, gy, gr, gr * Math.abs(i) / 3.5 + 1, 0, 0, Math.PI * 2); ctx.stroke(); }
    for (let i = 0; i < 6; i++) {
      const ph = ((i / 6) * Math.PI + t * 0.4) % Math.PI;
      ctx.beginPath(); ctx.ellipse(gx, gy, Math.abs(Math.cos(ph)) * gr + 1, gr, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
    // pin
    const kp = eOutBack(prog(t, v(4.3), 0.6));
    if (kp > 0) {
      const px = gx + 60, py = gy - 30;
      shockwave(t, v(4.4), C.gold, px, py, 160, 1.0, 5);
      ctx.save(); ctx.translate(px, py - (1 - kp) * 80);
      ctx.fillStyle = C.gold;
      ctx.beginPath(); ctx.arc(0, -58, 34, Math.PI, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -58, 34, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.bg; ctx.beginPath(); ctx.arc(0, -58, 13, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      text("الدوحة", px, py + 50, { font: font(900, 44), alpha: clamp(kp) });
    }
  }

  // right: text column
  const rx = CX + 720;
  const kh = eOutExpo(prog(t, v(3.1), 0.7));
  text("شبكة قنوات رياضية", rx, 300 - (1 - kh) * 40, { font: font(900, 92), align: "right", alpha: kh });
  const kd = eOutCubic(prog(t, v(4.3), 0.6));
  text("مقرّها الدوحة، قطر", rx, 410, { font: font(700, 56), color: C.muted, align: "right", alpha: kd });

  // heritage line: Al Jazeera Sport -> beIN SPORTS
  const k1 = eOutBack(prog(t, v(6.2), 0.6));
  const k2 = eOutCubic(prog(t, v(6.8), 0.7));
  const k3 = eOutBack(prog(t, v(7.3), 0.6));
  const by = 640;
  if (k1 > 0) chip("الجزيرة الرياضية", rx - 230, by, k1, "rgba(248,245,255,0.08)", C.muted);
  if (k2 > 0) {
    ctx.strokeStyle = C.magenta; ctx.lineWidth = 6; ctx.lineCap = "round";
    const x0 = rx - 470, x1 = lerp(x0, rx - 640, k2);
    ctx.beginPath(); ctx.moveTo(x0, by); ctx.lineTo(x1, by); ctx.stroke();
    if (k2 > 0.95) { ctx.beginPath(); ctx.moveTo(x1 + 18, by - 16); ctx.lineTo(x1, by); ctx.lineTo(x1 + 18, by + 16); ctx.stroke(); }
  }
  if (k3 > 0) chip("beIN SPORTS", rx - 880, by, k3, C.magenta, C.white, "ltr");
  const kn = eOutCubic(prog(t, v(7.3), 0.6));
  text("امتداداً لقنوات الجزيرة الرياضية", rx, 770, { font: font(700, 44), color: C.gold, align: "right", alpha: kn });
  ctx.restore();
}

function chip(label, cx, cy, k, fill, color, dir) {
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(k, k);
  ctx.font = font(900, 46);
  const w = ctx.measureText(label).width + 70;
  ctx.fillStyle = fill; roundRect(-w / 2, -42, w, 84, 42); ctx.fill();
  text(label, 0, 2, { font: font(900, 46), color, dir });
  ctx.restore();
}

// ---------- scene 3: competitions (9.9 - 17.4) ----------
const COMPS = [
  { name: "كأس العالم", icon: "trophy", at: v(11.4), col: C.gold },
  { name: "دوري أبطال أوروبا", icon: "stars", at: v(12.5), col: "#7FB4FF" },
  { name: "الدوري الإنجليزي", icon: "crown", at: v(14.1), col: C.magenta },
  { name: "الدوري الإسباني", icon: "sun", at: v(15.3), col: "#FF7A59" },
];
function scene3(t) {
  if (t < 9.8 || t > 17.8) return;
  const exit = eInCubic(prog(t, 17.2, 0.45));
  ctx.save();
  ctx.globalAlpha = 1 - exit;
  riseText("أكبر البطولات", CX, 190, eOutExpo(prog(t, v(9.4), 0.8)), 100, {});
  const ku = eOutCubic(prog(t, v(9.9), 0.6));
  ctx.fillStyle = C.magenta; roundRect(CX - 200 * ku, 270, 400 * ku, 7, 4); ctx.fill();

  const cw = 390, ch = 440, gap = 36, total = 4 * cw + 3 * gap;
  COMPS.forEach((c, i) => {
    const k = eOutBack(prog(t, c.at, 0.7));
    if (k <= 0) return;
    const x = CX + total / 2 - cw / 2 - i * (cw + gap); // right-to-left
    const y = 640 + (1 - clamp(k)) * 160 + exit * (i % 2 ? 120 : -120);
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha *= clamp(k * 1.4);
    ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
    ctx.fillStyle = C.card; roundRect(-cw / 2, -ch / 2, cw, ch, 34); ctx.fill();
    ctx.shadowColor = "transparent";
    ctx.save(); roundRect(-cw / 2, -ch / 2, cw, ch, 34); ctx.clip();
    const g = ctx.createLinearGradient(0, -ch / 2, 0, ch / 2);
    g.addColorStop(0, c.col + "40"); g.addColorStop(0.6, c.col + "00");
    ctx.fillStyle = g; ctx.fillRect(-cw / 2, -ch / 2, cw, ch);
    ctx.fillStyle = c.col; ctx.fillRect(-cw / 2, ch / 2 - 10, cw, 10);
    ctx.restore();
    ctx.strokeStyle = c.col + "88"; ctx.lineWidth = 2; roundRect(-cw / 2, -ch / 2, cw, ch, 34); ctx.stroke();
    const ki = eOutBack(prog(t, c.at + 0.15, 0.6));
    ctx.fillStyle = "rgba(248,245,255,0.06)"; ctx.beginPath(); ctx.arc(0, -60, 105 * ki, 0, Math.PI * 2); ctx.fill();
    icon(c.icon, 0, -60, 1.25 * ki, t, c.col);
    text(c.name, 0, 125, { font: font(900, c.name.length > 12 ? 44 : 54) });
    ctx.restore();
    shockwave(t, c.at + 0.1, c.col, x, 640, 330, 0.7, 6);
  });
  ctx.restore();
}

// ---------- scene 4: other sports (17.6 - 21.9) ----------
const SPORTS = [
  { name: "كرة القدم", type: "football", at: v(17.05) },
  { name: "التنس", type: "tennis", at: v(18.4) },
  { name: "كرة السلة", type: "basket", at: v(19.4) },
  { name: "كرة اليد", type: "hand", at: v(20.3) },
];
function scene4(t) {
  if (t < 17.4 || t > 22.4) return;
  const exit = eInCubic(prog(t, 21.85, 0.45));
  ctx.save();
  ctx.globalAlpha = 1 - exit;
  riseText("رياضات متعددة", CX, 200, eOutExpo(prog(t, v(16.9), 0.8)), 90, { color: C.white });
  const sp = 420, x0 = CX + 1.5 * sp;
  // connecting track
  const kl = eOutCubic(prog(t, v(17.1), 3.4));
  ctx.strokeStyle = "rgba(248,245,255,0.15)"; ctx.lineWidth = 4; ctx.setLineDash([12, 14]); ctx.lineDashOffset = t * 30;
  ctx.beginPath(); ctx.moveTo(x0, 560); ctx.lineTo(lerp(x0, x0 - 3 * sp, kl), 560); ctx.stroke();
  ctx.setLineDash([]);
  SPORTS.forEach((s, i) => {
    const x = x0 - i * sp;
    const k = prog(t, s.at, 0.7);
    if (k <= 0) return;
    // ball drops in and bounces
    const drop = k < 0.55 ? eInCubic(k / 0.55) : 1;
    const bounce = k >= 0.55 ? Math.abs(Math.sin((k - 0.55) / 0.45 * Math.PI)) * (1 - k) * 160 : 0;
    const y = lerp(-150, 560, drop) - bounce;
    const sq = k > 0.5 && k < 0.65 ? 1 - Math.sin((k - 0.5) / 0.15 * Math.PI) * 0.18 : 1;
    // glow
    const gk = eOutCubic(prog(t, s.at + 0.4, 0.5));
    const g = ctx.createRadialGradient(x, 560, 0, x, 560, 200);
    g.addColorStop(0, `rgba(214,58,249,${0.35 * gk})`); g.addColorStop(1, "rgba(214,58,249,0)");
    ctx.fillStyle = g; ctx.fillRect(x - 200, 360, 400, 400);
    ctx.save(); ctx.translate(x, y); ctx.scale(1 / sq, sq);
    sportBall(s.type, 0, 0, 110, t * 1.5 + i);
    ctx.restore();
    const kt = eOutCubic(prog(t, s.at + 0.35, 0.5));
    text(s.name, x, 760 + (1 - kt) * 30, { font: font(900, 58), alpha: kt });
    shockwave(t, s.at + 0.38, C.magenta, x, 640, 260, 0.6, 5);
  });
  ctx.restore();
}

// ---------- scene 5: 4K picture + Arabic commentary (22.0 - 28.2) ----------
function scene5(t) {
  if (t < 21.9 || t > 28.6) return;
  const exit = eInCubic(prog(t, 27.9, 0.45));
  ctx.save();
  ctx.globalAlpha = 1 - exit;

  // TV frame on the right with "4K"
  const kt = eOutBack(prog(t, v(21.6), 0.8));
  const tx = CX + 400, ty = 470, tw = 720 * kt, th = 420 * kt;
  if (kt > 0) {
    ctx.save();
    ctx.shadowColor = "rgba(214,58,249,0.5)"; ctx.shadowBlur = 60;
    ctx.fillStyle = "#0B0414"; roundRect(tx - tw / 2, ty - th / 2, tw, th, 24); ctx.fill();
    ctx.restore();
    ctx.lineWidth = 8; ctx.strokeStyle = C.violet; roundRect(tx - tw / 2, ty - th / 2, tw, th, 24); ctx.stroke();
    ctx.fillStyle = C.violet; roundRect(tx - 90 * kt, ty + th / 2 + 20, 180 * kt, 12, 6); ctx.fill();
    ctx.save(); roundRect(tx - tw / 2 + 8, ty - th / 2 + 8, tw - 16, th - 16, 18); ctx.clip();
    // pixel grid sharpening into a clean image
    const sharp = eInOutCubic(prog(t, v(22.9), 1.0));
    const cell = lerp(60, 6, sharp);
    for (let x = tx - tw / 2; x < tx + tw / 2; x += cell) for (let y = ty - th / 2; y < ty + th / 2; y += cell) {
      const d = Math.hypot(x - tx, y - ty) / 400;
      const n = 0.5 + 0.5 * Math.sin(x * 0.013 + y * 0.021 + t);
      ctx.fillStyle = `rgba(${lerp(94, 214, n) | 0},${lerp(43, 58, n) | 0},${lerp(151, 249, n) | 0},${0.55 * (1 - d * 0.6)})`;
      ctx.fillRect(x, y, cell - 1, cell - 1);
    }
    // scan line
    const sy = ty - th / 2 + ((t * 300) % th);
    ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(tx - tw / 2, sy, tw, 6);
    ctx.restore();
    const k4 = eOutBack(prog(t, v(22.9), 0.7));
    if (k4 > 0) {
      ctx.save(); ctx.translate(tx, ty); ctx.scale(k4, k4);
      text("4K", 0, 0, { font: font(900, 230), dir: "ltr", color: C.white, shadow: "rgba(255,255,255,0.6)" });
      ctx.restore();
      shockwave(t, v(22.95), C.white, tx, ty, 520, 0.8, 6);
    }
  }

  // left: copy + mic
  const lx = CX - 260;
  riseText("صورة بدقة", lx, 300, eOutExpo(prog(t, v(21.74), 0.7)), 96, { align: "right" });
  riseText("فور كيه", lx, 420, eOutExpo(prog(t, v(23.0), 0.7)), 96, { align: "right", color: C.gold });

  const km = eOutBack(prog(t, v(24.1), 0.7));
  if (km > 0) {
    const mx = lx - 60, my = 690;
    ctx.save(); ctx.globalAlpha *= clamp(km);
    ctx.fillStyle = C.magenta; ctx.beginPath(); ctx.arc(mx, my, 70 * km, 0, Math.PI * 2); ctx.fill();
    icon("mic", mx, my, 0.95 * km, t, C.white);
    // sound waves
    for (let i = 0; i < 3; i++) {
      const ph = (t * 1.4 + i / 3) % 1;
      ctx.strokeStyle = `rgba(214,58,249,${1 - ph})`; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(mx, my, 90 + ph * 120, -0.6, 0.6); ctx.stroke();
    }
    ctx.restore();
    const kc = eOutCubic(prog(t, v(24.3), 0.7));
    text("تعليق عربي", lx - 200, 660, { font: font(900, 72), align: "right", alpha: kc });
    text("يعيش معك كل لحظة", lx - 200, 750, { font: font(700, 46), color: C.muted, align: "right", alpha: eOutCubic(prog(t, v(25.3), 0.7)) });
  }
  ctx.restore();
}

// ---------- scene 6: outro (28.3 - 34) ----------
function scene6(t) {
  if (t < 28.2) return;
  shockwave(t, v(27.9), C.magenta, CX, CY - 40, 1000, 1.2, 12);
  shockwave(t, v(28.05), C.white, CX, CY - 40, 1100, 1.2, 5);
  const kr = eOutCubic(prog(t, 28.3, 1.0));
  ctx.save(); ctx.translate(CX, CY - 40); ctx.rotate(-t * 0.4);
  ctx.lineWidth = 10; ctx.lineCap = "round";
  for (let i = 0; i < 6; i++) {
    ctx.strokeStyle = i % 2 ? C.violet : C.magenta;
    const a0 = (i / 6) * Math.PI * 2;
    ctx.beginPath(); ctx.arc(0, 0, 560, a0, a0 + (Math.PI / 3 - 0.18) * kr); ctx.stroke();
  }
  ctx.restore();
  const kL = eOutExpo(prog(t, v(27.9), 0.8));
  ctx.save(); ctx.beginPath(); ctx.rect(0, CY - 260, W, 230); ctx.clip();
  text("بي إن سبورتس", CX, CY - 140 + (1 - kL) * 230, { font: font(900, 150), grad: [C.white, "#E6C9FF"] });
  ctx.restore();
  const kE = eOutCubic(prog(t, v(28.4), 0.7));
  text("beIN SPORTS", CX, CY + 0, { font: font(700, 54), dir: "ltr", color: C.muted, alpha: kE, spacing: lerp(30, 14, kE) });
  const kU = eOutCubic(prog(t, v(29.3), 0.6));
  ctx.fillStyle = C.magenta; roundRect(CX - 320 * kU, CY + 60, 640 * kU, 7, 4); ctx.fill();
  riseText("الملاعب في بيتك", CX, CY + 150, eOutExpo(prog(t, v(29.55), 0.8)), 84, { color: C.gold });
}

// ---------- master ----------
function render(t) {
  ctx.save();
  drawBackground(t);
  scene1(t); scene2(t); scene3(t); scene4(t); scene5(t); scene6(t);
  slashWipe(t, 3.2);
  slashWipe(t, 21.6);
  const f = Math.max(1 - prog(t, 0, 0.3), prog(t, DURATION - 0.9, 0.9));
  if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

window.DURATION = DURATION;
window.render = render;
window.ready = Promise.all([400, 700, 900].flatMap(w => [
  document.fonts.load(`${w} 50px Cairo`, "بي إن"),
  document.fonts.load(`${w} 50px Cairo`, "beIN 4K"),
])).then(() => true);

if (!navigator.webdriver) {
  const t0 = performance.now();
  window.ready.then(() => {
    const loop = now => { render(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
