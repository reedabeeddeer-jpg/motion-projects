<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><title>Ya Sahib al-Zaman</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  svg{display:block;width:1920px;height:1080px;background:#000}
</style></head>
<body>
<svg id="s" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <g id="cam"><g id="glow" style="filter:drop-shadow(0 0 8px rgba(255,255,255,.35))">
    <g id="lines"></g>
    <path id="swoosh" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"
      d="M300 735 C 700 700, 1200 690, 1690 705"/>
  </g>
  <g id="spark" opacity="0" style="filter:drop-shadow(0 0 14px #fff)">
    <path d="M0 -46 C 3 -10, 10 -3, 46 0 C 10 3, 3 10, 0 46 C -3 10, -10 3, -46 0 C -10 -3, -3 -10, 0 -46Z" fill="#fff"/>
    <path d="M0 -20 L3 -3 L20 0 L3 3 L0 20 L-3 3 L-20 0 L-3 -3Z" fill="#fff" transform="rotate(45)"/>
  </g></g>
  <rect id="fade" width="1920" height="1080" fill="#000" opacity="0"/>
</svg>
<script>
window.DURATION = 10;
const NS = "http://www.w3.org/2000/svg";
const SIZE = 330, X0 = 216;                      // font size (px) and left margin
const BASE = [610];                          // baseline y of each line
const TIMING = [[0.8, 6.0]];          // [start, end] writing time per line (s)
const SW_START = 5.9, SW_END = 7.1, SP_T = 6.8;   // swoosh + sparkle
const clamp = (v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lin = x => x;
const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;     // easeInOutCubic
const smooth = x => x*x*(3-2*x);

const P = window.PATHS, k = SIZE / P.upm, items = [];
const host = document.getElementById("lines");
P.lines.forEach((ln, li) => {
  const g = document.createElementNS(NS, "g");
  g.setAttribute("transform", `translate(${X0} ${BASE[li]}) scale(${k})`);
  host.appendChild(g);
  const sorted = ln.contours.slice().sort((a,b)=>b.cx-a.cx);   // right → left (Arabic writing order)
  const n = sorted.length, [t0, t1] = TIMING[li];
  const dur = Math.max((t1 - t0) * 0.12, 0.2), gap = (t1 - t0 - dur) / Math.max(n - 1, 1);
  sorted.forEach((c, i) => {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", c.d); p.setAttribute("fill", "#fff"); p.setAttribute("stroke", "#fff");
    p.setAttribute("stroke-linejoin", "round"); p.setAttribute("fill-opacity", 0);
    g.appendChild(p);
    const L = p.getTotalLength();
    p.style.strokeDasharray = L + " " + L;
    items.push({p, L, s: t0 + i * gap, d: dur, k});
  });
});

const sw = document.getElementById("swoosh"), swL = sw.getTotalLength();
sw.style.strokeDasharray = swL + " " + swL;
const spark = document.getElementById("spark");
const endPt = sw.getPointAtLength(swL);

window.render = function(t){
  for (const it of items){
    const p = clamp((t - it.s) / it.d), e = p;
    it.p.style.strokeDashoffset = it.L * (1 - e);
    const f = smooth(clamp((t - (it.s + it.d)) / 0.6));
    it.p.setAttribute("fill-opacity", f);
    it.p.setAttribute("stroke-width", (2.4 - 1.3 * f) / it.k);       // stroke thins as fill arrives
    it.p.style.opacity = p > 0 ? 1 : 0;
  }
  const sp = ease(clamp((t - SW_START) / (SW_END - SW_START)));
  sw.style.strokeDashoffset = swL * (1 - sp);
  sw.style.opacity = t >= SW_START ? 1 : 0;
  // sparkle flash at the end of the swoosh
  const q = clamp((t - SP_T) / 1.4), flash = q < .35 ? q/.35 : Math.max(0, 1 - (q-.35)/.65);
  const sc = 0.2 + 1.1 * Math.sin(Math.min(q,1) * Math.PI * .9);
  spark.setAttribute("opacity", flash);
  spark.setAttribute("transform", `translate(${endPt.x} ${endPt.y}) rotate(${q*40}) scale(${Math.max(sc,.01)})`);
  // slow push-in + fade out
  const z = 1 + 0.035 * (t / window.DURATION);
  document.getElementById("cam").setAttribute("transform", `translate(${X0} 540) scale(${z}) translate(${-X0} -540)`);
  const fo = clamp((t - 9.0) / 1.0), fi = 1 - clamp(t / 0.4);
  document.getElementById("fade").setAttribute("opacity", Math.max(fo, fi * 0));
};
window.render(0);
</script></body></html>
