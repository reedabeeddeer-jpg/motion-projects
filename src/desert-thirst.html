<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تايه في الصحراء</title>
<style>
  @font-face { font-family: "Cairo"; font-weight: 900; src: url(../assets/fonts/cairo-arabic-900-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+FE70-FEFF; }
  @font-face { font-family: "Cairo"; font-weight: 900; src: url(../assets/fonts/cairo-latin-900-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2026; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// A man lost in the desert, dying of thirst, calls out for water.
// 1920x1080, 5 seconds. 0-2.2s staggering walk, 2.2-3.6s reaches toward a mirage and shouts,
// 3.6-5s collapses to his knees.
const W = 1920, H = 1080, DURATION = 5;
const out = document.getElementById("c").getContext("2d");
const buf = Object.assign(document.createElement("canvas"), { width: W, height: H });
const ctx = buf.getContext("2d");
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k * k * (3 - 2 * k);
const span = (t, a, b) => ease(clamp((t - a) / (b - a)));
const rnd = (i => () => (i = (i * 16807) % 2147483647) / 2147483647)(7);

// fixed dust motes and film grain tiles
const motes = Array.from({ length: 140 }, () => ({ x: rnd() * W, y: 380 + rnd() * 700, r: 0.6 + rnd() * 2.4, v: 0.4 + rnd() }));
const grain = Array.from({ length: 4 }, () => {
  const c = Object.assign(document.createElement("canvas"), { width: 480, height: 270 });
  const g = c.getContext("2d"), d = g.createImageData(480, 270);
  for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
});

const SUN = { x: 1500, y: 250 };
const ground = x => 790 + Math.sin(x * 0.0021 + 1.1) * 38 + Math.sin(x * 0.0053) * 14;

function sky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, 640);
  g.addColorStop(0, "#c9772f"); g.addColorStop(0.55, "#f2b765"); g.addColorStop(1, "#fde2a8");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const pulse = 1 + Math.sin(t * 5) * 0.03;
  const glow = ctx.createRadialGradient(SUN.x, SUN.y, 20, SUN.x, SUN.y, 720 * pulse);
  glow.addColorStop(0, "rgba(255,255,240,1)"); glow.addColorStop(0.12, "rgba(255,246,205,0.95)");
  glow.addColorStop(0.35, "rgba(255,210,130,0.45)"); glow.addColorStop(1, "rgba(255,180,90,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#fffef6"; ctx.beginPath(); ctx.arc(SUN.x, SUN.y, 92 * pulse, 0, Math.PI * 2); ctx.fill();
}

function dune(off, base, amp, f, c1, c2, phase) {
  ctx.beginPath(); ctx.moveTo(-50, H);
  for (let x = -50; x <= W + 50; x += 12) {
    const X = x + off;
    ctx.lineTo(x, base + Math.sin(X * f + phase) * amp + Math.sin(X * f * 2.7 + phase * 2) * amp * 0.3);
  }
  ctx.lineTo(W + 50, H); ctx.closePath();
  const g = ctx.createLinearGradient(0, base - amp, 0, H);
  g.addColorStop(0, c1); g.addColorStop(1, c2); ctx.fillStyle = g; ctx.fill();
}

function mirage(t) {
  const a = span(t, 1.6, 2.6) * (1 - span(t, 4.0, 4.9)) * (0.55 + Math.sin(t * 9) * 0.08);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createRadialGradient(470, 612, 10, 470, 612, 330);
  g.addColorStop(0, "rgba(140,205,235,0.9)"); g.addColorStop(1, "rgba(140,205,235,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(470, 612, 330, 22, 0, 0, Math.PI * 2); ctx.fill();
  // ghost palms
  ctx.strokeStyle = "rgba(70,95,90,0.55)"; ctx.lineCap = "round";
  for (const [px, h] of [[400, 70], [455, 92], [540, 62]]) {
    ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(px, 608); ctx.quadraticCurveTo(px + 8, 608 - h / 2, px + 4, 608 - h); ctx.stroke();
    ctx.lineWidth = 3;
    for (let k = 0; k < 5; k++) {
      const an = -Math.PI + k * Math.PI / 4 + Math.sin(t * 3 + k) * 0.08;
      ctx.beginPath(); ctx.moveTo(px + 4, 608 - h);
      ctx.quadraticCurveTo(px + 4 + Math.cos(an) * 22, 608 - h + Math.sin(an) * 22 - 6, px + 4 + Math.cos(an) * 36, 608 - h + Math.sin(an) * 30 + 10);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function vultures(t) {
  ctx.strokeStyle = "rgba(60,30,15,0.75)"; ctx.lineWidth = 3; ctx.lineCap = "round";
  for (let i = 0; i < 3; i++) {
    const a = t * 0.7 + i * 2.1, x = 900 + Math.cos(a) * (240 + i * 60), y = 190 + Math.sin(a) * 60 + i * 30;
    const flap = Math.sin(t * 6 + i) * 6, s = 1 - i * 0.2;
    ctx.beginPath(); ctx.moveTo(x - 22 * s, y - 4 + flap); ctx.quadraticCurveTo(x - 9 * s, y - 9 * s, x, y);
    ctx.quadraticCurveTo(x + 9 * s, y - 9 * s, x + 22 * s, y - 4 + flap); ctx.stroke();
  }
}

// ---- the man (built from joints so the pose can blend walk -> reach -> kneel) ----
function leg(a1, b) {
  const knee = [Math.sin(a1) * 50, Math.cos(a1) * 50];
  return [knee, [knee[0] + Math.sin(a1 - b) * 48, knee[1] + Math.cos(a1 - b) * 48]];
}
function pose(t) {
  const ph = t * 7.5;                                  // stride phase
  const walk = 1 - span(t, 1.9, 2.4);
  const reach = span(t, 2.1, 2.7) * (1 - span(t, 3.7, 4.3));
  const kneel = span(t, 3.6, 4.4);
  const stumble = Math.max(0, Math.sin(t * 2.3)) ** 6 * walk;
  const legs = [0, Math.PI].map(o => {
    const s = Math.sin(ph + o);
    const wa = s * 0.38 * walk, wb = (0.15 + Math.max(0, -Math.cos(ph + o)) * 0.7) * walk + 0.12 * (1 - walk);
    const ka = o ? 0.15 : 1.15, kb = o ? 1.85 : 1.15;    // one knee down, one foot planted
    return leg(lerp(wa, ka, kneel), lerp(wb, kb, kneel));
  });
  const low = Math.max(...legs.flatMap(([k, f]) => [k[1], f[1]]));
  const lean = 0.18 + stumble * 0.25 + reach * 0.12 + kneel * 0.32 + Math.sin(t * 1.7) * 0.04;
  const arms = [
    // reaching arm: swings while walking, points at the mirage, then drops to the sand
    { u: lerp(lerp(Math.sin(ph) * 0.45, 1.8, reach), 0.55, kneel * (1 - reach)), f: lerp(lerp(0.3, 0.05, reach), 0.2, kneel) },
    // other hand clutches the throat
    { u: lerp(lerp(-Math.sin(ph) * 0.4, 0.9, 1 - walk), 0.9, kneel), f: lerp(lerp(0.4, 2.3, 1 - walk), 2.3, kneel) },
  ];
  return { legs, hip: -low + Math.abs(Math.sin(ph)) * -4 * walk, lean, arms, reach, kneel };
}

function man(t, x, y, s) {
  const p = pose(t), dir = -1;                         // faces left, toward the mirage
  const P = ([px, py]) => [px * dir, py];
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  // long shadow cast away from the sun
  ctx.fillStyle = "rgba(90,45,15,0.28)"; ctx.beginPath(); ctx.ellipse(-150, 4, 170, 13, -0.05, 0, Math.PI * 2); ctx.fill();
  const hip = [0, p.hip];
  const sh = [hip[0] + Math.sin(p.lean) * 74, hip[1] - Math.cos(p.lean) * 74];
  const head = [sh[0] + Math.sin(p.lean + 0.15) * 30, sh[1] - Math.cos(p.lean + 0.15) * 30];
  const ink = "#2b170d";
  ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const seg = (pts, w) => { ctx.lineWidth = w; ctx.beginPath(); pts.forEach((q, i) => { const [a, b] = P(q); i ? ctx.lineTo(a, b) : ctx.moveTo(a, b); }); ctx.stroke(); };
  for (const [k, f] of p.legs) seg([hip, [hip[0] + k[0], hip[1] + k[1]], [hip[0] + f[0], hip[1] + f[1]]], 17);
  // thobe: a flared robe from shoulders to below the knees
  const hem = p.hip + 62 - p.kneel * 20, flap = Math.sin(t * 8) * 6;
  ctx.beginPath();
  for (const q of [[sh[0] - 20, sh[1] - 4], [sh[0] + 20, sh[1] - 4], [hip[0] + 26 + flap, hem], [hip[0] - 28 + flap, hem + 4]]) { const [a, b] = P(q); ctx.lineTo(a, b); }
  ctx.closePath(); ctx.fill();
  seg([[sh[0] - 12, sh[1] + 2], [sh[0] + 12, sh[1] + 2]], 26);   // broad shoulders
  for (const a of p.arms) {
    const el = [sh[0] + Math.sin(a.u + p.lean * 0.3) * 42, sh[1] + Math.cos(a.u + p.lean * 0.3) * 42];
    const hd = [el[0] + Math.sin(a.u + a.f) * 40, el[1] + Math.cos(a.u + a.f) * 40];
    seg([sh, el, hd], 14);
  }
  // head + ghutra blowing in the wind
  const [hx, hy] = P(head);
  ctx.beginPath(); ctx.arc(hx, hy, 17, 0, Math.PI * 2); ctx.fill();
  const w1 = Math.sin(t * 9) * 5, w2 = Math.sin(t * 7 + 1) * 6;
  ctx.beginPath(); ctx.ellipse(hx - 9, hy + 15, 11, 8, 0.3, 0, Math.PI * 2); ctx.fill();          // beard
  ctx.beginPath(); ctx.moveTo(hx - 21, hy - 2); ctx.quadraticCurveTo(hx - 18, hy - 27, hx + 4, hy - 24);   // ghutra over the head
  ctx.quadraticCurveTo(hx + 26, hy - 14, hx + 30 + w1, hy + 18); ctx.lineTo(hx + 36 + w2, hy + 48);       // draping down the back
  ctx.lineTo(hx + 6, hy + 40); ctx.lineTo(hx + 2, hy + 6); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(255,190,110,0.35)"; ctx.lineWidth = 3;                                   // agal band catching light
  ctx.beginPath(); ctx.ellipse(hx - 1, hy - 14, 19, 5, -0.2, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
  // warm rim light from the sun behind him
  ctx.globalCompositeOperation = "lighter"; ctx.strokeStyle = "rgba(255,170,80,0.22)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(hx, hy, 18, -Math.PI * 0.6, Math.PI * 0.1); ctx.stroke();
  ctx.restore();
}

function footprints(manX) {
  ctx.fillStyle = "rgba(120,60,20,0.22)";
  for (let x = manX + 70, i = 0; x < W + 40; x += 46, i++) {
    ctx.beginPath(); ctx.ellipse(x, ground(x) + 6 + (i % 2) * 8, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
  }
}

function dust(t) {
  for (const m of motes) {
    const x = ((m.x - t * 260 * m.v) % W + W) % W, y = m.y + Math.sin(t * 2 + m.x) * 10;
    ctx.fillStyle = `rgba(255,230,180,${0.25 + m.v * 0.25})`; ctx.beginPath(); ctx.arc(x, y, m.r, 0, Math.PI * 2); ctx.fill();
  }
}

function caption(t, text, a, b, y, size, color, latin) {
  const k = span(t, a, a + 0.25) * (1 - span(t, b - 0.25, b));
  if (k <= 0) return;
  const jit = (1 - k) * 18 + 2.2;
  out.save(); out.globalAlpha = k;
  out.translate(W / 2 + Math.sin(t * 61) * jit, y + Math.cos(t * 47) * jit);
  out.scale(0.85 + k * 0.15, 0.85 + k * 0.15);
  out.font = `900 ${size}px "Cairo"`; out.textAlign = "center"; out.textBaseline = "middle";
  out.direction = latin ? "ltr" : "rtl";
  out.lineJoin = "round"; out.lineWidth = size * 0.14; out.strokeStyle = "rgba(40,15,5,0.9)"; out.strokeText(text, 0, 0);
  out.fillStyle = color; out.fillText(text, 0, 0);
  out.restore();
}

window.DURATION = DURATION;
window.render = async t => {
  const zoom = 1 + t * 0.018 + span(t, 2.3, 2.6) * 0.03;
  const shake = span(t, 2.3, 2.5) * (1 - span(t, 3.0, 3.5)) * 6;
  ctx.save();
  ctx.translate(W / 2 + Math.sin(t * 53) * shake, H / 2 + Math.cos(t * 41) * shake); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2);
  sky(t); vultures(t);
  dune(t * 8, 600, 26, 0.0016, "#e0a35e", "#c98a4a", 0.6);
  mirage(t);
  dune(t * 18, 690, 40, 0.0024, "#d9924e", "#b8733b", 2.2);
  // foreground dune where the man walks
  ctx.beginPath(); ctx.moveTo(-50, H);
  for (let x = -50; x <= W + 50; x += 10) ctx.lineTo(x, ground(x));
  ctx.lineTo(W + 50, H); ctx.closePath();
  const g = ctx.createLinearGradient(0, 720, 0, H); g.addColorStop(0, "#efb56c"); g.addColorStop(1, "#b9703a"); ctx.fillStyle = g; ctx.fill();
  const manX = lerp(1260, 1110, span(t, 0, 2.3)) - span(t, 3.6, 4.4) * 10;
  footprints(manX);
  man(t, manX, ground(manX) + 4, 1.55);
  dust(t);
  ctx.restore();

  // heat haze: wobble the rows below the horizon
  out.drawImage(buf, 0, 0);
  for (let y = 520; y < H; y += 4) {
    const amt = (1 - (y - 520) / 700) * 5;
    out.drawImage(buf, 0, y, W, 4, Math.sin(y * 0.09 + t * 14) * amt, y, W, 4);
  }

  // sun-bleached grade, vignette that tightens as he weakens, grain
  out.save();
  out.globalCompositeOperation = "soft-light"; out.fillStyle = "rgba(255,140,40,0.35)"; out.fillRect(0, 0, W, H);
  out.globalCompositeOperation = "source-over";
  const vin = 0.55 + span(t, 3.5, 5) * 0.3;
  const v = out.createRadialGradient(W / 2, H / 2, 380, W / 2, H / 2, 1150);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, `rgba(30,8,0,${vin})`); out.fillStyle = v; out.fillRect(0, 0, W, H);
  // blurry eyes: white flash pulses near the end
  out.fillStyle = `rgba(255,240,210,${Math.max(0, Math.sin(t * 4)) * span(t, 3.8, 5) * 0.25})`; out.fillRect(0, 0, W, H);
  out.globalAlpha = 0.07; out.globalCompositeOperation = "overlay";
  out.drawImage(grain[Math.floor(t * 30) % 4], 0, 0, W, H);
  out.restore();

  caption(t, "عطشان… وين الماي؟", 0.6, 2.1, 930, 92, "#fff3dc");
  caption(t, "Water… where is the water?!", 2.25, 3.6, 930, 84, "#ffe1a8", true);
  caption(t, "أين الماء؟!", 3.75, 5.05, 930, 120, "#fff3dc");
};
window.ready = document.fonts.load(`900 92px "Cairo"`, "عطشان Water")
  .then(() => document.fonts.ready).then(() => window.render(0));
</script>
</body>
</html>
