<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Greeting</title>
<style>
  @font-face { font-family: Cairo; font-weight: 400; src: url(../assets/fonts/cairo-arabic-400-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Cairo; font-weight: 700; src: url(../assets/fonts/cairo-arabic-700-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Cairo; font-weight: 900; src: url(../assets/fonts/cairo-arabic-900-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  html, body { margin: 0; background: #0B0F1F; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Voiceover "السلام عليكم أيها الرجل" (ElevenLabs) synced to output/voice/salam-alaykum.mp3.
const W = 1920, H = 1080, CX = W / 2, CY = H / 2;
const DURATION = 6;
const VOICE_AT = 1.2;            // seconds into the video where the voice starts
const C = { bg: "#0B0F1F", white: "#F5F7FF", muted: "#8A93B8", gold: "#FFC145", teal: "#3DDBD9", violet: "#7B61FF", coral: "#FF4D6D" };
// RMS envelope of the voice, one value per 1/30 s
const ENV = [0.0,0.01,0.27,0.38,0.36,0.26,0.27,0.27,0.79,0.86,0.87,1.0,0.96,0.86,0.69,0.69,0.73,0.82,0.83,0.88,0.98,0.68,0.68,0.79,0.99,0.75,0.12,0.12,0.17,0.95,0.7,0.52,0.45,0.39,0.63,0.68,0.57,0.87,0.93,0.8,0.57,0.63,0.7,0.41,0.17,0.34,0.7,0.69,0.43,0.22,0.33,0.7,0.78,0.69,0.54,0.41,0.2,0.04,0.02,0.01,0.01,0.01,0.01,0.01,0.01,0.01,0.0];
const ctx = document.getElementById("c").getContext("2d");

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, start, dur) => clamp((t - start) / dur);
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const eInCubic = k => k * k * k;
const eOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const font = (w, s) => `${w} ${s}px Cairo`;
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function level(t) {
  const x = (t - VOICE_AT) * 30;
  if (x < 0 || x >= ENV.length - 1) return 0;
  const i = Math.floor(x), f = x - i;
  return ENV[i] * (1 - f) + ENV[i + 1] * f;
}

const particles = (() => {
  const r = rng(11); const out = [];
  for (let i = 0; i < 80; i++) out.push({ x: r() * W, y: r() * H, s: 1 + r() * 2.5, v: 10 + r() * 30, p: r() * 6.28 });
  return out;
})();

function background(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(CX, CY, 40, CX, CY, 1000);
  g.addColorStop(0, `rgba(123,97,255,${0.14 + level(t) * 0.12})`);
  g.addColorStop(0.6, "rgba(61,219,217,0.03)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const p of particles) {
    const y = (p.y - t * p.v + H) % H;
    ctx.fillStyle = `rgba(245,247,255,${0.12 + 0.18 * Math.sin(t * 1.4 + p.p)})`;
    ctx.beginPath(); ctx.arc(p.x, y, p.s, 0, 6.28); ctx.fill();
  }
}

// Eight-point star (Islamic geometric motif) drawn as two rotated squares
function star(cx, cy, r, rot, alpha, draw) {
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.globalAlpha *= alpha;
  ctx.strokeStyle = C.gold; ctx.lineWidth = 3;
  for (let k = 0; k < 2; k++) {
    ctx.save(); ctx.rotate(k * Math.PI / 4);
    ctx.setLineDash([r * 8 * draw, r * 8]);
    ctx.strokeRect(-r, -r, 2 * r, 2 * r);
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, 6.28 * draw);
  ctx.strokeStyle = C.teal; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

// Voice-reactive equalizer bars
function equalizer(t, y, alpha) {
  const n = 41, gap = 18;
  ctx.save(); ctx.globalAlpha *= alpha;
  for (let i = 0; i < n; i++) {
    const d = Math.abs(i - (n - 1) / 2) / ((n - 1) / 2);
    const lv = level(t - d * 0.12);
    const h = 6 + lv * 90 * (1 - d * 0.6) * (0.75 + 0.25 * Math.sin(i * 2.3 + t * 9));
    const x = CX + (i - (n - 1) / 2) * gap;
    const g = ctx.createLinearGradient(0, y - h, 0, y + h);
    g.addColorStop(0, C.teal); g.addColorStop(1, C.violet);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(x - 4, y - h / 2, 8, h, 4); ctx.fill();
  }
  ctx.restore();
}

function text(str, x, y, f, color, alpha, scale = 1) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.direction = "rtl"; ctx.font = f; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.globalAlpha *= alpha; ctx.fillStyle = color;
  ctx.fillText(str, 0, 0);
  ctx.restore();
}

function render(t) {
  ctx.save();
  background(t);

  // 1) star emblem draws itself, then breathes with the voice
  const sk = eOutCubic(prog(t, 0.1, 1.1));
  star(CX, CY - 250, 70 + level(t) * 10, t * 0.25, sk, sk);

  // 2) gold line sweeps in from the right (RTL)
  const lk = eOutCubic(prog(t, 0.5, 0.9));
  ctx.save();
  const lg = ctx.createLinearGradient(CX - 520, 0, CX + 520, 0);
  lg.addColorStop(0, "rgba(255,193,69,0)"); lg.addColorStop(0.5, C.gold); lg.addColorStop(1, "rgba(255,193,69,0)");
  ctx.fillStyle = lg;
  ctx.fillRect(CX + 520 - 1040 * lk, CY + 30, 1040 * lk, 3);
  ctx.restore();

  // 3) "السلام عليكم" — mask wipe right→left as the voice says it
  const ak = prog(t, VOICE_AT - 0.05, 0.85);
  if (ak > 0) {
    ctx.save();
    const wipe = eOutCubic(ak);
    ctx.beginPath(); ctx.rect(CX + 760 - 1520 * wipe, CY - 300, 1520 * wipe, 360); ctx.clip();
    const glow = level(t);
    ctx.shadowColor = C.gold; ctx.shadowBlur = 20 + glow * 40;
    text("السلام عليكم", CX, CY - 90, font(900, 150), C.white, 1, 1 + glow * 0.03);
    ctx.restore();
  }

  // 4) "أيها الرجل" — rises in on the second phrase
  const bk = prog(t, VOICE_AT + 0.95, 0.6);
  if (bk > 0) {
    const e = eOutBack(bk);
    text("أيها الرجل", CX, CY + 110 + (1 - e) * 60, font(700, 92), C.gold, clamp(bk * 1.6), 0.9 + 0.1 * e);
  }

  // 5) equalizer reacting to the voice
  equalizer(t, CY + 290, eOutCubic(prog(t, 0.8, 0.6)));

  // fade in / out
  const f = Math.max(1 - prog(t, 0, 0.35), eInCubic(prog(t, DURATION - 0.7, 0.7)));
  if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

window.DURATION = DURATION;
window.render = render;
window.ready = Promise.all([700, 900].map(w => document.fonts.load(`${w} 50px Cairo`, "السلام"))).then(() => true);

if (!navigator.webdriver) {
  const t0 = performance.now();
  window.ready.then(() => {
    const loop = now => { render(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
