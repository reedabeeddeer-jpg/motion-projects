<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Kinetic Text</title>
<style>
  @font-face { font-family: Cairo; font-weight: 700; src: url(../assets/fonts/cairo-arabic-700-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Cairo; font-weight: 900; src: url(../assets/fonts/cairo-arabic-900-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  html, body { margin: 0; background: #07060E; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// 10 s kinetic typography: four phrases, each enters and exits with a different effect.
const W = 1920, H = 1080, CX = W / 2, CY = H / 2;
const DURATION = 10;
const C = { bg: "#07060E", white: "#F6F4FF", pink: "#FF2E88", cyan: "#19E3FF", yellow: "#FFE14A", violet: "#8A5CFF" };
const ctx = document.getElementById("c").getContext("2d");

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, s, d) => clamp((t - s) / d);
const lerp = (a, b, k) => a + (b - a) * k;
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const eInCubic = k => k * k * k;
const eOutExpo = k => k === 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

function makeLayer() { const c = document.createElement("canvas"); c.width = W; c.height = H; return c; }
const layer = makeLayer(), tintA = makeLayer(), tintB = makeLayer();

// ---------- phrases ----------
const PHRASES = [
  { text: "كل شي يبدأ بكلمة",   start: 0.0, end: 2.6, size: 150, color: C.white, accent: C.pink,   enter: "words",  exit: "glitch" },
  { text: "وبعدين تختفي",       start: 2.6, end: 5.0, size: 170, color: C.white, accent: C.cyan,   enter: "glitch", exit: "collapse" },
  { text: "وتطلع وحدة ثانية",   start: 5.0, end: 7.4, size: 150, color: C.white, accent: C.yellow, enter: "wipe",   exit: "zoom" },
  { text: "فيديو خبل",          start: 7.4, end: 10.0, size: 260, color: C.yellow, accent: C.pink,  enter: "slam",   exit: "none" },
];

// ---------- background ----------
const dots = (() => { const r = rng(11); return Array.from({ length: 90 }, () => ({ x: r() * W, y: r() * H, s: 1 + r() * 3, v: 10 + r() * 40, p: r() * 6.28 })); })();

function background(t, accent) {
  const g = ctx.createRadialGradient(CX, CY, 50, CX, CY, 1200);
  g.addColorStop(0, "#1A1033"); g.addColorStop(1, C.bg);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // moving perspective-less grid
  ctx.save(); ctx.strokeStyle = accent; ctx.globalAlpha = 0.07; ctx.lineWidth = 2;
  const off = (t * 40) % 80;
  for (let x = -80 + off; x < W + 80; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = -80 + off; y < H + 80; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
  ctx.save(); ctx.fillStyle = accent;
  for (const d of dots) {
    ctx.globalAlpha = 0.15 + 0.2 * Math.sin(t * 2 + d.p);
    ctx.fillRect(d.x, (d.y - t * d.v + H * 4) % H, d.s, d.s);
  }
  ctx.restore();
}

// ---------- text layer ----------
function words(text, size) {
  ctx.save(); ctx.font = `900 ${size}px Cairo`; ctx.direction = "rtl";
  const parts = text.split(" "), gap = size * 0.28;
  const ws = parts.map(p => ctx.measureText(p).width);
  ctx.restore();
  const total = ws.reduce((a, b) => a + b, 0) + gap * (parts.length - 1);
  let x = CX + total / 2; // RTL: first word sits on the right
  return parts.map((p, i) => { const o = { p, w: ws[i], cx: x - ws[i] / 2 }; x -= ws[i] + gap; return o; });
}

// draw the phrase to `layer` (clear background); fn(i,n) -> {alpha, dy, scale, blur}
function drawPhrase(ph, per) {
  const l = layer.getContext("2d");
  l.clearRect(0, 0, W, H);
  l.save(); l.font = `900 ${ph.size}px Cairo`; l.direction = "rtl"; l.textAlign = "center"; l.textBaseline = "middle";
  const ws = words(ph.text, ph.size);
  ws.forEach((w, i) => {
    const s = per ? per(i, ws.length) : { alpha: 1, dy: 0, scale: 1, blur: 0 };
    if (s.alpha <= 0) return;
    l.save();
    l.globalAlpha = s.alpha; l.filter = s.blur > 0.3 ? `blur(${s.blur}px)` : "none";
    l.translate(w.cx, CY + s.dy); l.scale(s.scale, s.scale);
    l.shadowColor = ph.accent; l.shadowBlur = 40;
    l.fillStyle = ph.color; l.fillText(w.p, 0, 0);
    l.restore();
  });
  l.restore();
}

function tint(dst, color) {
  const d = dst.getContext("2d");
  d.clearRect(0, 0, W, H); d.globalCompositeOperation = "source-over"; d.drawImage(layer, 0, 0);
  d.globalCompositeOperation = "source-in"; d.fillStyle = color; d.fillRect(0, 0, W, H);
  d.globalCompositeOperation = "source-over";
}

// composite layer with RGB split + slice displacement. amt 0..1
function drawGlitched(amt, seed, accentA, accentB) {
  const r = rng(seed);
  const split = amt * 28;
  tint(tintA, accentA); tint(tintB, accentB);
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = 0.85;
  ctx.drawImage(tintA, -split, 0); ctx.drawImage(tintB, split, 0);
  ctx.restore();
  const bands = 16, bh = H / bands;
  for (let i = 0; i < bands; i++) {
    const dx = r() < 0.35 + 0.4 * amt ? (r() - 0.5) * amt * 420 : 0;
    ctx.drawImage(layer, 0, i * bh, W, bh, dx, i * bh, W, bh);
  }
}

function drawPlain() { ctx.drawImage(layer, 0, 0); }

// ---------- overlays ----------
function scanlines(a) {
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = "#000";
  for (let y = 0; y < H; y += 6) ctx.fillRect(0, y, W, 2);
  ctx.restore();
}
function vignette() {
  const g = ctx.createRadialGradient(CX, CY, 500, CX, CY, 1150);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.65)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function flash(a, color = "#fff") { if (a > 0.01) { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); ctx.restore(); } }

// ---------- per-phrase render ----------
function renderPhrase(ph, idx, t) {
  const u = t - ph.start, dur = ph.end - ph.start;
  const inDur = ph.enter === "words" ? 1.1 : ph.enter === "slam" ? 0.5 : 0.7;
  const outDur = ph.exit === "none" ? 0 : 0.55;
  const outP = outDur ? prog(u, dur - outDur, outDur) : 0;
  const seed = 100 + idx * 17 + Math.floor(t * 30);
  ctx.save();

  // ----- enter -----
  if (outP === 0) {
    const k = prog(u, 0, inDur);
    if (ph.enter === "words") {
      drawPhrase(ph, (i, n) => { const p = prog(u, i * 0.22, 0.5); const e = eOutBack(p); return { alpha: p, dy: (1 - eOutCubic(p)) * 120, scale: lerp(0.6, 1, e), blur: (1 - p) * 24 }; });
      drawPlain();
    } else if (ph.enter === "glitch") {
      drawPhrase(ph);
      const amt = k < 1 ? (1 - k) : 0;
      ctx.globalAlpha = k < 0.15 ? 0 : clamp(k * 3);
      if (amt > 0) drawGlitched(amt, seed, C.pink, ph.accent); else drawPlain();
    } else if (ph.enter === "wipe") {
      drawPhrase(ph);
      const e = eOutExpo(k);
      // reveal right → left (reading direction) behind a bright bar
      const edge = W - e * W;
      ctx.save(); ctx.beginPath(); ctx.rect(edge, 0, W - edge, H); ctx.clip(); drawPlain(); ctx.restore();
      if (k < 1) { ctx.save(); ctx.fillStyle = ph.accent; ctx.globalAlpha = 1 - k; ctx.fillRect(edge - 10, CY - 190, 20, 380); ctx.restore(); }
    } else if (ph.enter === "slam") {
      const sc = lerp(2.6, 1, eOutExpo(k));
      drawPhrase(ph);
      const pulse = 1 + (u > inDur ? 0.025 * Math.sin((u - inDur) * 6) : 0);
      ctx.translate(CX, CY); ctx.scale(sc * pulse, sc * pulse); ctx.translate(-CX, -CY);
      if (u < inDur + 0.4) { const sh = Math.max(0, 1 - (u - inDur * 0.8) / 0.5); ctx.translate((Math.sin(u * 90)) * 14 * sh, (Math.cos(u * 70)) * 10 * sh); }
      ctx.globalAlpha = clamp(k * 4);
      drawGlitched(Math.max(0, 0.35 * (1 - u / 1.0)), seed, C.pink, C.cyan);
      if (k >= 0.95) drawPlain();
    }
  } else {
    // ----- exit -----
    if (ph.exit === "glitch") {
      drawPhrase(ph);
      ctx.globalAlpha = 1 - eInCubic(outP);
      drawGlitched(Math.min(1, outP * 1.6), seed, C.pink, C.cyan);
    } else if (ph.exit === "collapse") {
      drawPhrase(ph);
      const sy = Math.max(0.004, 1 - eInCubic(outP)); // squash to a line
      const sx = outP > 0.7 ? 1 - prog(outP, 0.7, 0.3) : 1;
      ctx.translate(CX, CY); ctx.scale(sx, sy); ctx.translate(-CX, -CY);
      ctx.globalAlpha = 1;
      drawPlain();
      if (outP > 0.55) { ctx.save(); ctx.globalAlpha = 1 - prog(outP, 0.85, 0.15); ctx.fillStyle = "#fff"; ctx.shadowColor = ph.accent; ctx.shadowBlur = 40; ctx.fillRect(CX - 700 * sx, CY - 3, 1400 * sx, 6); ctx.restore(); }
    } else if (ph.exit === "zoom") {
      drawPhrase(ph);
      const sc = lerp(1, 3.2, eInCubic(outP));
      ctx.translate(CX, CY); ctx.scale(sc, sc); ctx.translate(-CX, -CY);
      ctx.globalAlpha = 1 - outP;
      drawGlitched(outP * 0.5, seed, C.yellow, C.violet);
    }
  }
  ctx.restore();
}

// ---------- accent shapes that punctuate each transition ----------
function transitions(t) {
  for (let i = 1; i < PHRASES.length; i++) {
    const b = PHRASES[i].start, d = t - b;
    if (d > -0.12 && d < 0.5) flash(clamp(1 - Math.abs(d) / 0.12) * 0.0 + (d >= 0 ? (1 - d / 0.5) * 0.18 : 0), PHRASES[i].accent);
    if (d >= 0 && d < 0.7) { // shockwave ring
      const k = d / 0.7;
      ctx.save(); ctx.strokeStyle = PHRASES[i].accent; ctx.globalAlpha = 1 - k; ctx.lineWidth = 14 * (1 - k) + 2;
      ctx.beginPath(); ctx.arc(CX, CY, 80 + eOutCubic(k) * 900, 0, 6.2832); ctx.stroke(); ctx.restore();
    }
  }
}

function render(t) {
  t = Math.min(t, DURATION - 1e-6);
  const idx = PHRASES.findIndex(p => t >= p.start && t < p.end);
  const ph = PHRASES[idx];
  background(t, ph.accent);
  // short blank gap shows overlap-free swaps: a phrase is gone before the next enters
  renderPhrase(ph, idx, t);
  transitions(t);
  scanlines(0.12);
  vignette();
  // global fade in/out
  const fo = prog(t, DURATION - 0.5, 0.5), fi = 1 - prog(t, 0, 0.25);
  flash(Math.max(fo, fi), "#000");
}

window.DURATION = DURATION;
window.render = render;
window.ready = document.fonts.load("900 100px Cairo", "كل شي").then(() => document.fonts.ready).then(() => { render(0); });
if (!navigator.webdriver) {
  window.ready.then(() => { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); });
}
</script>
</body>
</html>
