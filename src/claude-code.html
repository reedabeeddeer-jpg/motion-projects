<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Claude Code</title>
<style>
  @font-face { font-family: Cairo; font-weight: 400; src: url(../assets/fonts/cairo-arabic-400-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Cairo; font-weight: 700; src: url(../assets/fonts/cairo-arabic-700-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Cairo; font-weight: 900; src: url(../assets/fonts/cairo-arabic-900-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Cairo; font-weight: 400; src: url(../assets/fonts/cairo-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2022; }
  @font-face { font-family: Cairo; font-weight: 700; src: url(../assets/fonts/cairo-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2022; }
  @font-face { font-family: Cairo; font-weight: 900; src: url(../assets/fonts/cairo-latin-900-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2022; }
  html, body { margin: 0; background: #14110F; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, CX = W / 2, CY = H / 2, DURATION = 12;
const C = { bg: "#14110F", panel: "#1E1A17", line: "#3A322C", orange: "#D97757", cream: "#F4EEE6", muted: "#9C9186", green: "#7BD88F", blue: "#79B8FF" };
const ctx = document.getElementById("c").getContext("2d");
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, s, d) => clamp((t - s) / d);
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = k => 1 - Math.pow(1 - k, 3);
const eBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const font = (w, s) => `${w} ${s}px Cairo`;
const mono = s => `500 ${s}px "DejaVu Sans Mono", monospace`;
function text(str, x, y, o = {}) {
  ctx.save(); ctx.direction = o.dir || "rtl"; ctx.font = o.font || font(700, 60); ctx.textAlign = o.align || "center"; ctx.textBaseline = "middle";
  ctx.globalAlpha *= o.alpha ?? 1; if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur ?? 40; }
  ctx.fillStyle = o.color || C.cream; ctx.fillText(str, x, y); ctx.restore();
}
function bg(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(255,255,255,0.035)"; ctx.lineWidth = 1;
  const o = (t * 20) % 60; for (let x = -60 + o; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  const g = ctx.createRadialGradient(CX, CY, 50, CX, CY, 1000); g.addColorStop(0, "rgba(217,119,87,0.16)"); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function spark(x, y, r, rot, a = 1) { // generic starburst mark
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha *= a; ctx.fillStyle = C.orange; ctx.shadowColor = C.orange; ctx.shadowBlur = 40;
  for (let i = 0; i < 8; i++) { ctx.rotate(Math.PI / 4); ctx.beginPath(); ctx.roundRect(-r * 0.09, 0, r * 0.18, r, r * 0.09); ctx.fill(); }
  ctx.restore();
}
function termWindow(x, y, w, h, a, title) {
  ctx.save(); ctx.globalAlpha = a; ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 60; ctx.shadowOffsetY = 25;
  ctx.fillStyle = C.panel; ctx.beginPath(); ctx.roundRect(x, y, w, h, 22); ctx.fill(); ctx.shadowColor = "transparent";
  ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.stroke();
  ["#FF5F57", "#FEBC2E", "#28C840"].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + 36 + i * 32, y + 36, 9, 0, 7); ctx.fill(); });
  text(title, x + w / 2, y + 36, { font: mono(22), color: C.muted, dir: "ltr" }); ctx.restore();
}
function typed(str, t, start, cps) { return str.slice(0, Math.floor(clamp((t - start) * cps, 0, str.length))); }

function s1(t) { // 0-3
  bg(t); const k = eBack(prog(t, 0.2, 0.9));
  spark(CX, 330, 130 * k, t * 0.6 - 2 + (1 - k) * 3, prog(t, 0.2, 0.4));
  text("Claude Code", CX, 560, { font: font(900, 190), color: C.cream, dir: "ltr", alpha: prog(t, 0.7, 0.6), glow: "rgba(217,119,87,0.45)" });
  text("مساعد البرمجة الذي يعيش في الطرفية", CX, 720, { font: font(400, 58), color: C.orange, alpha: prog(t, 1.4, 0.7) });
  const line = prog(t, 0.7, 1.2); ctx.fillStyle = C.orange; ctx.fillRect(CX - 360 * line, 650, 720 * line, 4);
}
function s2(t, l) { // 3-6.5 terminal demo
  bg(t); const a = eOut(prog(l, 0, 0.5));
  const x = 260, y = 130 + (1 - a) * 60, w = 1400, h = 800;
  termWindow(x, y, w, h, a, "claude — ~/my-project");
  ctx.save(); ctx.globalAlpha = a; let ly = y + 130;
  const P = "fix the login bug in auth.ts";
  const cmd = typed(P, l, 0.5, 26);
  text("❯ " + cmd + (l < 2.0 && Math.floor(l * 3) % 2 ? "▌" : ""), x + 60, ly, { font: mono(36), color: C.cream, dir: "ltr", align: "left" });
  const steps = [["Read", "src/auth.ts", C.blue, 1.5], ["Edit", "validateToken() — +4 −1", C.orange, 2.0], ["Bash", "npm test  ·  42 passed", C.green, 2.5]];
  steps.forEach(([v, d, c, st], i) => {
    const p = eOut(prog(l, st, 0.35)); if (!p) return; const yy = ly + 90 + i * 90;
    ctx.save(); ctx.globalAlpha *= p; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + 70, yy, 11, 0, 7); ctx.fill();
    text(v, x + 100, yy, { font: mono(34), color: c, dir: "ltr", align: "left" });
    text(d, x + 260, yy, { font: mono(32), color: C.cream, dir: "ltr", align: "left" }); ctx.restore();
  });
  const done = eBack(prog(l, 3.0, 0.4));
  if (done > 0) { ctx.save(); ctx.translate(x + 60, ly + 450); ctx.globalAlpha *= clamp(done); ctx.fillStyle = "rgba(123,216,143,0.12)"; ctx.strokeStyle = C.green; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(0, 0, 780, 120, 18); ctx.fill(); ctx.stroke();
    text("✓ تم إصلاح الخطأ وتمرير الاختبارات", 390, 62, { font: font(700, 44), color: C.green }); ctx.restore(); }
  ctx.restore();
}
function s3(t, l) { // 6.5-9.3 features
  bg(t); text("ماذا يفعل كلود كود؟", CX, 160, { font: font(900, 80), alpha: eOut(prog(l, 0, 0.5)) });
  const F = [["يفهم مشروعك", "يقرأ الكود كاملاً ويتتبع الروابط بين الملفات", "⌕"], ["يكتب وينفّذ", "يعدّل الملفات ويشغّل الأوامر والاختبارات", "⚡"], ["يعمل أينما كنت", "في الطرفية والمتصفح ومحررات الكود", "❯"]];
  F.forEach(([h1, d, ic], i) => {
    const p = eBack(prog(l, 0.4 + i * 0.3, 0.6)), x = CX + (1 - i) * 600, y = 580;
    ctx.save(); ctx.translate(x, y); ctx.scale(p, p); ctx.globalAlpha = clamp(p);
    ctx.fillStyle = C.panel; ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(-270, -300, 540, 600, 28); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(217,119,87,0.15)"; ctx.beginPath(); ctx.arc(0, -160, 80, 0, 7); ctx.fill();
    text(ic, 0, -158, { font: font(900, 80), color: C.orange, dir: "ltr" });
    text(h1, 0, -10, { font: font(900, 58), color: C.cream });
    const words = d.split(" "); let line = "", ly2 = 90, lines = [];
    for (const wd of words) { if ((line + " " + wd).length > 20) { lines.push(line); line = wd; } else line = line ? line + " " + wd : wd; } lines.push(line);
    lines.forEach((ln, j) => text(ln, 0, ly2 + j * 54, { font: font(400, 36), color: C.muted }));
    ctx.restore();
  });
}
function s4(t, l) { // 9.3-12
  bg(t); const k = eBack(prog(l, 0, 0.8));
  spark(CX, 300, 120 * k, t * 0.8, prog(l, 0, 0.3));
  text("Claude Code", CX, 520, { font: font(900, 170), dir: "ltr", alpha: prog(l, 0.3, 0.5), glow: "rgba(217,119,87,0.45)" });
  text("ابنِ أسرع. فكّر أبعد.", CX, 670, { font: font(700, 70), color: C.orange, alpha: prog(l, 0.8, 0.6) });
  ctx.save(); ctx.globalAlpha = prog(l, 1.3, 0.5); ctx.fillStyle = C.panel; ctx.strokeStyle = C.orange; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(CX - 360, 790, 720, 100, 50); ctx.fill(); ctx.stroke();
  text("claude.com/claude-code", CX, 842, { font: mono(38), color: C.cream, dir: "ltr" }); ctx.restore();
}
function post(t) {
  const g = ctx.createRadialGradient(CX, CY, 450, CX, CY, 1150); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.55)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  if (t < 3) s1(t); else if (t < 6.5) s2(t, t - 3); else if (t < 9.3) s3(t, t - 6.5); else s4(t, t - 9.3);
  for (const c of [3, 6.5, 9.3]) { const d = t - c; if (d >= 0 && d < 0.2) { ctx.fillStyle = `rgba(217,119,87,${0.45 * (1 - d / 0.2)})`; ctx.fillRect(0, 0, W, H); } }
  post(t); const f = Math.max(1 - prog(t, 0, 0.4), prog(t, DURATION - 0.6, 0.6)); ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H);
}
window.DURATION = DURATION; window.render = render;
window.ready = Promise.all([400, 700, 900].flatMap(w => [document.fonts.load(`${w} 50px Cairo`, "كلود"), document.fonts.load(`${w} 50px Cairo`, "ABC")])).then(() => true);
if (!navigator.webdriver) { const t0 = performance.now(); window.ready.then(() => { const loop = n => { render(((n - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }); }
</script>
</body>
</html>
