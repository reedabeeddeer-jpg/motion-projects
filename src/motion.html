<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Motion Graphics</title>
<style>
  @font-face { font-family: Cairo; font-weight: 400; src: url(../assets/fonts/cairo-arabic-400-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Cairo; font-weight: 700; src: url(../assets/fonts/cairo-arabic-700-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Cairo; font-weight: 900; src: url(../assets/fonts/cairo-arabic-900-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Cairo; font-weight: 400; src: url(../assets/fonts/cairo-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2022; }
  @font-face { font-family: Cairo; font-weight: 700; src: url(../assets/fonts/cairo-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2022; }
  @font-face { font-family: Cairo; font-weight: 900; src: url(../assets/fonts/cairo-latin-900-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2022; }
  html, body { margin: 0; background: #0B0F1F; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, CX = W / 2, CY = H / 2;
const DURATION = 13;
const C = {
  bg: "#0B0F1F", card: "#151B33", white: "#F5F7FF", muted: "#8A93B8",
  coral: "#FF4D6D", amber: "#FFC145", teal: "#3DDBD9", violet: "#7B61FF",
};
const ctx = document.getElementById("c").getContext("2d");

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, start, dur) => clamp((t - start) / dur);
const lerp = (a, b, k) => a + (b - a) * k;
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const eInCubic = k => k * k * k;
const eInOutCubic = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eOutExpo = k => k === 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const font = (w, s) => `${w} ${s}px Cairo`;

// deterministic pseudo-random
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

function arabicText(str, x, y, opts = {}) {
  ctx.save();
  ctx.direction = "rtl";
  ctx.font = opts.font || font(700, 60);
  ctx.textAlign = opts.align || "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = opts.color || C.white;
  ctx.globalAlpha *= opts.alpha ?? 1;
  ctx.fillText(str, x, y);
  ctx.restore();
}

// ---------- background ----------
const particles = (() => {
  const r = rng(7); const out = [];
  for (let i = 0; i < 70; i++) out.push({ x: r() * W, y: r() * H, s: 1 + r() * 2.5, v: 8 + r() * 25, p: r() * Math.PI * 2 });
  return out;
})();

function drawBackground(t) {
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  const g = ctx.createRadialGradient(CX, CY, 50, CX, CY, 1100);
  g.addColorStop(0, "rgba(123,97,255,0.16)");
  g.addColorStop(0.5, "rgba(61,219,217,0.04)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // slow rotating rings
  ctx.save();
  ctx.translate(CX, CY);
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 3; i++) {
    ctx.save();
    ctx.rotate(t * (0.08 + i * 0.05) * (i % 2 ? -1 : 1));
    ctx.strokeStyle = `rgba(245,247,255,${0.05 - i * 0.012})`;
    ctx.setLineDash([4 + i * 6, 18 + i * 10]);
    ctx.beginPath();
    ctx.arc(0, 0, 380 + i * 170, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  // drifting particles
  for (const p of particles) {
    const y = (p.y - t * p.v + H) % H;
    const a = 0.15 + 0.2 * Math.sin(t * 1.5 + p.p);
    ctx.fillStyle = `rgba(245,247,255,${a})`;
    ctx.beginPath();
    ctx.arc(p.x, y, p.s, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- shared elements ----------
function shockwave(t, start, color, maxR = 520, dur = 1.1, width = 6) {
  const k = prog(t, start, dur);
  if (k <= 0 || k >= 1) return;
  const e = eOutCubic(k);
  ctx.save();
  ctx.strokeStyle = color;
  ctx.globalAlpha = 1 - k;
  ctx.lineWidth = width * (1 - k) + 1;
  ctx.beginPath();
  ctx.arc(CX, CY, e * maxR, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

// 2x2 logo grid of rounded squares
const LOGO_COLORS = [C.coral, C.amber, C.teal, C.violet];
function logoGrid(cx, cy, size, gap, rot, alpha = 1, spread = 0) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.globalAlpha *= alpha;
  const off = (size + gap) / 2 + spread;
  [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sy], i) => {
    ctx.fillStyle = LOGO_COLORS[i];
    roundRect(sx * off - size / 2, sy * off - size / 2, size, size, size * 0.28);
    ctx.fill();
  });
  ctx.restore();
}

function floaters(t, alpha) {
  if (alpha <= 0) return;
  const items = [
    { x: 260, y: 230, type: "tri", c: C.teal, s: 46 },
    { x: 1660, y: 260, type: "plus", c: C.amber, s: 40 },
    { x: 1580, y: 840, type: "ring", c: C.coral, s: 34 },
    { x: 330, y: 830, type: "sq", c: C.violet, s: 40 },
    { x: 1760, y: 560, type: "dot", c: C.teal, s: 12 },
    { x: 150, y: 540, type: "dot", c: C.coral, s: 10 },
  ];
  items.forEach((it, i) => {
    const bob = Math.sin(t * 1.6 + i) * 16;
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.translate(it.x, it.y + bob);
    ctx.rotate(t * (i % 2 ? 0.7 : -0.5));
    ctx.strokeStyle = it.c; ctx.fillStyle = it.c; ctx.lineWidth = 6; ctx.lineCap = "round";
    const s = it.s;
    ctx.beginPath();
    if (it.type === "tri") { ctx.moveTo(0, -s); ctx.lineTo(s * 0.87, s * 0.5); ctx.lineTo(-s * 0.87, s * 0.5); ctx.closePath(); ctx.stroke(); }
    else if (it.type === "plus") { ctx.moveTo(-s / 2, 0); ctx.lineTo(s / 2, 0); ctx.moveTo(0, -s / 2); ctx.lineTo(0, s / 2); ctx.stroke(); }
    else if (it.type === "ring") { ctx.arc(0, 0, s / 2, 0, Math.PI * 2); ctx.stroke(); }
    else if (it.type === "sq") { ctx.strokeRect(-s / 2, -s / 2, s, s); }
    else { ctx.arc(0, 0, s / 2, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  });
}

// ---------- scene 1: logo build (0 - 3.1) ----------
function scene1(t) {
  if (t > 3.2) return;
  // center dot pops
  const kDot = eOutBack(prog(t, 0.05, 0.6));
  const dotFade = 1 - prog(t, 0.9, 0.3);
  if (kDot > 0 && dotFade > 0) {
    ctx.save();
    ctx.globalAlpha = dotFade;
    ctx.fillStyle = C.coral;
    ctx.beginPath();
    ctx.arc(CX, CY, 46 * kDot, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  shockwave(t, 0.35, C.coral, 560);
  shockwave(t, 0.5, C.amber, 640);
  shockwave(t, 0.65, C.teal, 720);

  // squares fly in from corners and assemble
  const size = 92, gap = 18;
  const off = (size + gap) / 2;
  const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
  const exitK = eInCubic(prog(t, 2.25, 0.5));
  corners.forEach(([sx, sy], i) => {
    const k = eOutBack(prog(t, 0.7 + i * 0.12, 0.8));
    if (k <= 0) return;
    const fromX = CX + sx * 1100, fromY = CY + sy * 700;
    const toX = CX + sx * off, toY = CY + sy * off;
    const spin = (1 - k) * Math.PI * 1.5 * (i % 2 ? 1 : -1);
    // after assembly the whole grid rotates 45deg then collapses
    const settle = eInOutCubic(prog(t, 1.7, 0.6));
    const gridRot = settle * Math.PI / 4 + exitK * Math.PI / 2;
    const gridScale = (1 + settle * 0.15) * (1 - exitK * 0.9);
    let x = lerp(fromX, toX, k) - CX, y = lerp(fromY, toY, k) - CY;
    const cr = Math.cos(gridRot), sr = Math.sin(gridRot);
    const rx = (x * cr - y * sr) * gridScale, ry = (x * sr + y * cr) * gridScale;
    ctx.save();
    ctx.translate(CX + rx, CY + ry);
    ctx.rotate(spin + gridRot);
    ctx.scale(gridScale, gridScale);
    ctx.fillStyle = LOGO_COLORS[i];
    roundRect(-size / 2, -size / 2, size, size, size * 0.28);
    ctx.fill();
    ctx.restore();
  });

  // little label under logo
  const kl = eOutCubic(prog(t, 1.5, 0.5)) * (1 - prog(t, 2.2, 0.3));
  if (kl > 0) {
    ctx.save();
    ctx.globalAlpha = kl;
    ctx.font = font(700, 28);
    ctx.letterSpacing = `${lerp(30, 12, kl)}px`;
    ctx.fillStyle = C.muted;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("MOTION  STUDIO", CX, CY + 200 + (1 - kl) * 20);
    ctx.restore();
  }
}

// double circle wipe transition
function circleWipe(t, start, colorA, colorB) {
  const R = Math.hypot(W, H) / 2 + 20;
  const kA = eInOutCubic(prog(t, start, 0.55));
  const kB = eInOutCubic(prog(t, start + 0.22, 0.55));
  if (kA <= 0 || kB >= 1) return;
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, kA * R, 0, Math.PI * 2);
  if (kB > 0) ctx.arc(CX, CY, kB * R, 0, Math.PI * 2, true);
  ctx.fillStyle = colorA;
  ctx.fill("evenodd");
  ctx.restore();
}

// ---------- scene 2: title (3.0 - 6.3) ----------
function scene2(t) {
  if (t < 3.0 || t > 6.4) return;
  const exit = eInCubic(prog(t, 5.75, 0.5));
  const shiftX = -exit * 900;
  const alpha = 1 - exit;

  floaters(t, eOutCubic(prog(t, 3.3, 0.6)) * alpha);

  ctx.save();
  ctx.translate(shiftX, 0);
  ctx.globalAlpha = alpha;

  // small eyebrow tag
  const kTag = eOutBack(prog(t, 3.2, 0.5));
  if (kTag > 0) {
    ctx.save();
    ctx.translate(CX, 330);
    ctx.scale(kTag, kTag);
    ctx.fillStyle = "rgba(61,219,217,0.14)";
    roundRect(-140, -30, 280, 60, 30); ctx.fill();
    ctx.strokeStyle = C.teal; ctx.lineWidth = 2; ctx.stroke();
    arabicText("استوديو الحركة", 0, 2, { font: font(700, 30), color: C.teal });
    ctx.restore();
  }

  // main title: slides up from behind a clip line
  const kT = eOutExpo(prog(t, 3.35, 0.9));
  const titleY = 490;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, titleY - 140, W, 240);
  ctx.clip();
  arabicText("موشن جرافيك", CX, titleY + (1 - kT) * 230, { font: font(900, 190), color: C.white });
  ctx.restore();

  // underline grows right -> left (RTL)
  const kU = eOutCubic(prog(t, 3.9, 0.6));
  if (kU > 0) {
    const uw = 760;
    ctx.fillStyle = C.coral;
    roundRect(CX + uw / 2 - uw * kU, titleY + 125, uw * kU, 12, 6); ctx.fill();
    // trailing dot
    ctx.fillStyle = C.amber;
    ctx.beginPath(); ctx.arc(CX + uw / 2 - uw * kU - 24, titleY + 131, 9 * kU, 0, Math.PI * 2); ctx.fill();
  }

  // subtitle words, laid out right-to-left, staggered
  const words = [["حركة", C.teal], ["لون", C.amber], ["قصة", C.coral]];
  ctx.font = font(700, 58);
  const sepW = 70;
  const widths = words.map(([w]) => { ctx.direction = "rtl"; return ctx.measureText(w).width; });
  const total = widths.reduce((a, b) => a + b, 0) + sepW * (words.length - 1);
  let x = CX + total / 2; // start from right edge
  words.forEach(([w, col], i) => {
    const k = eOutBack(prog(t, 4.25 + i * 0.18, 0.55));
    const cx = x - widths[i] / 2;
    if (k > 0) {
      arabicText(w, cx, 700 + (1 - k) * 50, { font: font(700, 58), color: col, alpha: clamp(k) });
    }
    x -= widths[i];
    if (i < words.length - 1) {
      const kd = eOutBack(prog(t, 4.35 + i * 0.18, 0.4));
      if (kd > 0) {
        ctx.fillStyle = C.muted;
        ctx.beginPath(); ctx.arc(x - sepW / 2, 706, 7 * kd, 0, Math.PI * 2); ctx.fill();
      }
      x -= sepW;
    }
  });
  ctx.restore();
}

// ---------- scene 3: process cards (6.1 - 9.7) ----------
function drawIcon(type, t, color) {
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 7; ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (type === "idea") {
    // glowing core with rotating rays
    const pulse = 1 + Math.sin(t * 5) * 0.06;
    ctx.beginPath(); ctx.arc(0, 0, 30 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(t * 0.9);
    for (let i = 0; i < 8; i++) {
      ctx.rotate(Math.PI / 4);
      const len = 14 + 6 * Math.sin(t * 6 + i);
      ctx.beginPath(); ctx.moveTo(0, 46); ctx.lineTo(0, 46 + len); ctx.stroke();
    }
  } else if (type === "design") {
    ctx.save(); ctx.rotate(t * 0.8);
    ctx.strokeRect(-34, -34, 48, 48); ctx.restore();
    ctx.beginPath(); ctx.arc(18, 8, 28, 0, Math.PI * 2); ctx.globalAlpha = 0.85; ctx.fill(); ctx.globalAlpha = 1;
    ctx.save(); ctx.translate(-6, 20); ctx.rotate(-t * 1.1);
    ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(23, 14); ctx.lineTo(-23, 14); ctx.closePath();
    ctx.strokeStyle = C.white; ctx.lineWidth = 5; ctx.stroke(); ctx.restore();
  } else {
    // animated sine wave + ball
    ctx.beginPath();
    for (let x = -60; x <= 60; x += 3) {
      const y = Math.sin(x / 14 - t * 6) * 18;
      x === -60 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    const bx = Math.sin(t * 2.2) * 55;
    ctx.fillStyle = C.white;
    ctx.beginPath(); ctx.arc(bx, Math.sin(bx / 14 - t * 6) * 18, 11, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function scene3(t) {
  if (t < 6.1 || t > 9.8) return;
  // heading
  const kh = eOutCubic(prog(t, 6.2, 0.6)) * (1 - eInCubic(prog(t, 9.0, 0.4)));
  arabicText("كيف نصنع الحركة؟", CX, 175 - (1 - kh) * 60, { font: font(900, 66), color: C.white, alpha: kh });

  const cards = [
    { label: "فكرة", num: "01", icon: "idea", color: C.amber, dx: 470 },
    { label: "تصميم", num: "02", icon: "design", color: C.teal, dx: 0 },
    { label: "حركة", num: "03", icon: "motion", color: C.coral, dx: -470 },
  ];
  const cw = 400, ch = 470, cy = 600;
  cards.forEach((cd, i) => {
    const kin = eOutBack(prog(t, 6.35 + i * 0.16, 0.7));
    const kout = eInCubic(prog(t, 9.0 + i * 0.08, 0.45));
    if (kin <= 0 || kout >= 1) return;
    const cx = CX + cd.dx * (1 - kout);
    const s = lerp(0.6, 1, clamp(kin, 0, 1.2)) * (1 - kout);
    ctx.save();
    ctx.translate(cx, cy + (1 - kin) * 140);
    ctx.scale(s, s);
    ctx.rotate(kout * 0.6 * (i - 1));
    ctx.globalAlpha = clamp(kin * 1.5);

    // shadow + card
    ctx.shadowColor = "rgba(0,0,0,0.45)"; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
    ctx.fillStyle = C.card;
    roundRect(-cw / 2, -ch / 2, cw, ch, 36); ctx.fill();
    ctx.shadowColor = "transparent";
    // colored top strip
    ctx.save(); roundRect(-cw / 2, -ch / 2, cw, ch, 36); ctx.clip();
    ctx.fillStyle = cd.color; ctx.fillRect(-cw / 2, -ch / 2, cw, 10);
    ctx.restore();

    // big faded number
    ctx.font = font(900, 120);
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillStyle = "rgba(245,247,255,0.06)";
    ctx.fillText(cd.num, -cw / 2 + 26, -ch / 2 + 22);

    // icon disc
    const ki = eOutBack(prog(t, 6.7 + i * 0.16, 0.6));
    ctx.save();
    ctx.translate(0, -60);
    ctx.scale(ki, ki);
    ctx.fillStyle = "rgba(245,247,255,0.05)";
    ctx.beginPath(); ctx.arc(0, 0, 92, 0, Math.PI * 2); ctx.fill();
    drawIcon(cd.icon, t, cd.color);
    ctx.restore();

    arabicText(cd.label, 0, 95, { font: font(900, 64), color: C.white });

    // progress bar + counter
    const kp = eInOutCubic(prog(t, 7.0 + i * 0.25, 1.1));
    const bw = 300;
    ctx.fillStyle = "rgba(245,247,255,0.1)";
    roundRect(-bw / 2, 175, bw, 10, 5); ctx.fill();
    if (kp > 0) { ctx.fillStyle = cd.color; roundRect(bw / 2 - bw * kp, 175, bw * kp, 10, 5); ctx.fill(); }
    ctx.font = font(700, 26); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = C.muted;
    ctx.fillText(`${Math.round(kp * 100)}%`, 0, 148);
    ctx.restore();
  });

  // connecting dashed line between cards (behind feel, drawn after for simplicity at low alpha)
  const kl = eOutCubic(prog(t, 7.0, 0.8)) * (1 - prog(t, 8.9, 0.2));
  if (kl > 0) {
    ctx.save();
    ctx.strokeStyle = "rgba(245,247,255,0.25)"; ctx.lineWidth = 3; ctx.setLineDash([10, 12]);
    ctx.lineDashOffset = t * 40;
    [[CX + 470 - 200, CX + 200], [CX - 200, CX - 470 + 200]].forEach(([x1, x2]) => {
      ctx.beginPath(); ctx.moveTo(x1, 540); ctx.lineTo(lerp(x1, x2, kl), 540); ctx.stroke();
    });
    ctx.restore();
  }
}

// ---------- scene 4: outro (9.5 - 13) ----------
function scene4(t) {
  if (t < 9.45) return;
  shockwave(t, 9.55, C.violet, 700, 1.2, 8);
  shockwave(t, 9.7, C.teal, 820, 1.2, 6);

  const k = eOutBack(prog(t, 9.5, 0.8));
  const spin = (1 - eOutCubic(prog(t, 9.5, 1.0))) * Math.PI * 1.5;
  const breathe = 1 + Math.sin(t * 2.5) * 0.02;
  if (k > 0) logoGrid(CX, 400, 74 * k * breathe, 14, Math.PI / 4 + spin, clamp(k), (1 - clamp(k)) * 80);

  const kt = eOutExpo(prog(t, 10.1, 0.9));
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 560, W, 150); ctx.clip();
  arabicText("شكراً للمشاهدة", CX, 640 + (1 - kt) * 140, { font: font(900, 104), color: C.white });
  ctx.restore();

  const ks = eOutCubic(prog(t, 10.6, 1.0));
  if (ks > 0) {
    ctx.save();
    ctx.globalAlpha = ks;
    ctx.font = font(700, 32);
    ctx.letterSpacing = `${lerp(48, 16, ks)}px`;
    ctx.fillStyle = C.muted; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("MOTION  GRAPHICS", CX + 8, 770);
    ctx.restore();
  }

  // lines extending from center
  const kln = eOutCubic(prog(t, 10.4, 0.7));
  if (kln > 0) {
    ctx.fillStyle = C.coral;
    roundRect(CX - 360 - 150 * kln, 768, 150 * kln, 4, 2); ctx.fill();
    ctx.fillStyle = C.teal;
    roundRect(CX + 360, 768, 150 * kln, 4, 2); ctx.fill();
  }
}

// ---------- master ----------
function render(t) {
  ctx.save();
  drawBackground(t);
  scene1(t);
  scene2(t);
  scene3(t);
  scene4(t);
  circleWipe(t, 2.55, C.coral);
  circleWipe(t, 2.75, C.violet);
  // fade in / out
  const fadeIn = 1 - prog(t, 0, 0.25);
  const fadeOut = prog(t, DURATION - 0.7, 0.7);
  const f = Math.max(fadeIn, fadeOut);
  if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

window.DURATION = DURATION;
window.render = render;
window.ready = document.fonts.load(font(900, 50) + "")
  .then(() => Promise.all([400, 700, 900].flatMap(w => [
    document.fonts.load(`${w} 50px Cairo`, "موشن"),
    document.fonts.load(`${w} 50px Cairo`, "ABC"),
  ])))
  .then(() => true);

// live preview when opened directly in a browser
if (!navigator.webdriver) {
  const t0 = performance.now();
  window.ready.then(() => {
    const loop = now => { render(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
