<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Cinema</title>
<style>
  @font-face { font-family: Cairo; font-weight: 400; src: url(../assets/fonts/cairo-arabic-400-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Cairo; font-weight: 700; src: url(../assets/fonts/cairo-arabic-700-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Cairo; font-weight: 900; src: url(../assets/fonts/cairo-arabic-900-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Cairo; font-weight: 400; src: url(../assets/fonts/cairo-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2022; }
  @font-face { font-family: Cairo; font-weight: 700; src: url(../assets/fonts/cairo-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2022; }
  @font-face { font-family: Cairo; font-weight: 900; src: url(../assets/fonts/cairo-latin-900-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2022; }
  html, body { margin: 0; background: #07060A; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, CX = W / 2, CY = H / 2;
const DURATION = 12;
const C = { bg: "#07060A", red: "#B3122B", redD: "#5E0A17", gold: "#F5C451", goldD: "#B8862B", white: "#FFF6E5", muted: "#9A8F7A" };
const ctx = document.getElementById("c").getContext("2d");
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, s, d) => clamp((t - s) / d);
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = k => 1 - Math.pow(1 - k, 3);
const eIO = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const font = (w, s) => `${w} ${s}px Cairo`;
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function text(str, x, y, o = {}) {
  ctx.save(); ctx.direction = "rtl"; ctx.font = o.font || font(700, 60); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.globalAlpha *= o.alpha ?? 1;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur ?? 40; }
  ctx.fillStyle = o.color || C.white; ctx.fillText(str, x, y); ctx.restore();
}
const dust = (() => { const r = rng(11); return Array.from({ length: 90 }, () => ({ x: r() * W, y: r() * H, s: 1 + r() * 2.5, v: 10 + r() * 30, p: r() * 6.28 })); })();

function room(t, lit = 1) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(CX, 420, 50, CX, 420, 1100);
  g.addColorStop(0, `rgba(179,18,43,${0.22 * lit})`); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function beam(t, a) {
  // projector beam from bottom center towards the screen
  ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = "lighter";
  const flick = 0.9 + 0.1 * Math.sin(t * 60) * Math.sin(t * 13);
  const g = ctx.createLinearGradient(CX, H, CX, 150);
  g.addColorStop(0, `rgba(255,236,190,${0.55 * flick})`); g.addColorStop(1, `rgba(255,236,190,${0.05 * flick})`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(CX - 30, H); ctx.lineTo(CX + 30, H); ctx.lineTo(CX + 620, 150); ctx.lineTo(CX - 620, 150); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#fff"; for (const d of dust) {
    const y = (d.y - t * d.v + 4000) % H, x = CX + (d.x - CX) * (0.05 + 0.95 * (1 - y / H) * 0.9);
    const inBeam = Math.abs(d.x - CX) < 80 + (1 - y / H) * 560; if (!inBeam) continue;
    ctx.globalAlpha = a * (0.25 + 0.25 * Math.sin(t * 2 + d.p)); ctx.beginPath(); ctx.arc(CX + (d.x - CX) * (1 - y / H) * 0.9, y, d.s, 0, 7); ctx.fill();
  }
  ctx.restore();
}
function curtains(open) {
  const k = eIO(open), w = CX + 4;
  for (const side of [-1, 1]) {
    ctx.save(); const x = side < 0 ? -k * w : CX + k * w - 4 + 4; ctx.translate(x, 0);
    const g = ctx.createLinearGradient(0, 0, w, 0);
    for (let i = 0; i <= 12; i++) g.addColorStop(i / 12, i % 2 ? C.red : C.redD);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, H);
    const sh = ctx.createLinearGradient(0, 0, 0, H); sh.addColorStop(0, "rgba(0,0,0,0.5)"); sh.addColorStop(0.3, "rgba(0,0,0,0)"); sh.addColorStop(1, "rgba(0,0,0,0.6)");
    ctx.fillStyle = sh; ctx.fillRect(0, 0, w, H); ctx.restore();
  }
  ctx.fillStyle = C.gold; ctx.fillRect(0, 0, W, 26); ctx.fillStyle = C.goldD; ctx.fillRect(0, 26, W, 6);
}
function filmstrip(t, y, dir, speed, h = 150) {
  ctx.save(); ctx.fillStyle = "#111"; ctx.fillRect(0, y, W, h);
  const fw = 220, off = (t * speed * dir) % fw;
  for (let i = -1; i < W / fw + 2; i++) {
    const x = i * fw + off;
    ctx.fillStyle = "#F4EBD3"; for (let r = 0; r < 2; r++) ctx.fillRect(x + 20, y + (r ? h - 18 : 6), 30, 12);
    const hue = (i * 47 + 20) % 360, idx = Math.round((x - off) / fw);
    const g = ctx.createLinearGradient(x, y, x + fw, y + h);
    const hh = (((idx * 53) % 360) + 360) % 360;
    g.addColorStop(0, `hsl(${hh},60%,35%)`); g.addColorStop(1, `hsl(${(hh + 60) % 360},70%,18%)`);
    ctx.fillStyle = g; ctx.fillRect(x + 8, y + 26, fw - 24, h - 52);
  }
  ctx.restore();
}
function bulbs(t, x1, y1, x2, y2, n, on = 1) {
  for (let i = 0; i < n; i++) {
    const x = lerp(x1, x2, i / (n - 1)), y = lerp(y1, y2, i / (n - 1));
    const lit = (Math.floor(t * 6) + i) % 3 !== 0 ? 1 : 0.25;
    ctx.save(); ctx.globalAlpha = on; ctx.shadowColor = C.gold; ctx.shadowBlur = 24 * lit;
    ctx.fillStyle = lit > 0.5 ? "#FFE9A8" : "#6B5320"; ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill(); ctx.restore();
  }
}
function ticket(x, y, rot, s, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.globalAlpha = a;
  ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 20;
  ctx.fillStyle = C.gold; ctx.beginPath(); ctx.roundRect(-330, -150, 660, 300, 24); ctx.fill(); ctx.shadowColor = "transparent";
  ctx.fillStyle = C.bg; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * 330, 0, 34, 0, 7); ctx.fill(); }
  ctx.strokeStyle = "#7A5A1A"; ctx.setLineDash([12, 12]); ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-170, -130); ctx.lineTo(-170, 130); ctx.stroke(); ctx.setLineDash([]);
  text("تذكرة دخول", 80, -50, { font: font(900, 66), color: "#2A1500" });
  text("مقعد ٧ · صف ١٢", 80, 40, { font: font(700, 40), color: "#5A3B0A" });
  text("ADMIT ONE", -235, 0, { font: font(900, 20), color: "#5A3B0A" });
  ctx.restore();
}
function seats(t, a) {
  ctx.save(); ctx.globalAlpha = a;
  for (let r = 0; r < 4; r++) for (let i = 0; i < 14; i++) {
    const x = 160 + i * 112 + (r % 2) * 56, y = 780 + r * 70;
    ctx.fillStyle = `rgba(${90 - r * 12},8,20,1)`; ctx.beginPath(); ctx.roundRect(x - 36, y - 30, 72, 60, [24, 24, 8, 8]); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(x - 36, y + 10, 72, 20);
  }
  ctx.restore();
}
function screenFrame(t, a, label) {
  ctx.save(); ctx.globalAlpha = a;
  const x = CX - 620, y = 150, w = 1240, h = 520;
  ctx.shadowColor = "rgba(255,236,190,0.35)"; ctx.shadowBlur = 80;
  const g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, "#2a2438"); g.addColorStop(1, "#14101c");
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h); ctx.shadowBlur = 0;
  ctx.strokeStyle = C.gold; ctx.lineWidth = 6; ctx.strokeRect(x, y, w, h); ctx.restore();
}

// ---------- scenes ----------
function s1(t) { // 0-3.2 curtains open, title
  room(t); const open = prog(t, 0.6, 1.8);
  const a = prog(t, 1.2, 1);
  beam(t, a * 0.6);
  const ts = eBack(prog(t, 1.4, 1.0));
  ctx.save(); ctx.translate(CX, CY - 40); ctx.scale(ts, ts);
  text("سينما", 0, 0, { font: font(900, 260), color: C.gold, glow: "rgba(245,196,81,0.6)", blur: 60, alpha: prog(t, 1.4, 0.4) }); ctx.restore();
  text("حيث تبدأ الحكاية", CX, CY + 130, { font: font(400, 58), color: C.white, alpha: prog(t, 2.2, 0.8) });
  curtains(open);
}
function s2(t, l) { // 3.2-6.2 filmstrips + screen
  room(t); beam(t, 0.5); screenFrame(t, 1);
  const k = eOut(prog(l, 0, 0.7));
  filmstrip(t, 40, 1, 160, 130); filmstrip(t, H - 170, -1, 160, 130);
  // leader countdown inside screen
  const n = 3 - Math.floor(l / 0.6); const lp = (l % 0.6) / 0.6;
  if (n >= 1) {
    ctx.save(); ctx.beginPath(); ctx.rect(CX - 620, 150, 1240, 520); ctx.clip();
    ctx.strokeStyle = "rgba(245,196,81,0.5)"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(CX, 410, 190, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CX - 620, 410); ctx.lineTo(CX + 620, 410); ctx.moveTo(CX, 150); ctx.lineTo(CX, 670); ctx.stroke();
    ctx.strokeStyle = C.gold; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(CX, 410, 190, -Math.PI / 2, -Math.PI / 2 + lp * 6.283); ctx.stroke();
    text(String(n), CX, 420, { font: font(900, 280), color: C.white, alpha: 1 - lp * 0.5 }); ctx.restore();
  } else {
    const p = prog(l, 1.8, 0.6); ctx.save(); ctx.fillStyle = `rgba(255,246,229,${(1 - p) * 0.9})`; ctx.fillRect(CX - 620, 150, 1240, 520); ctx.restore();
    text("ثلاثة ، اثنان ، واحد ... ابدأ", CX, 410, { font: font(900, 90), color: C.gold, alpha: eOut(p) });
  }
  text("الشاشة تُضيء ... والعالم يتلاشى", CX, 800, { font: font(700, 46), color: C.white, alpha: prog(l, 0.3, 0.6) });
}
function s3(t, l) { // 6.2-9.2 ticket + features
  room(t); beam(t, 0.25); seats(t, 0.6);
  ticket(CX, 330 + (1 - eOut(prog(l, 0, 0.9))) * -700, -0.07 + 0.07 * eOut(prog(l, 0, 1.2)), 1, 1);
  const feats = ["شاشة عملاقة", "صوت محيطي", "مقاعد فاخرة"];
  feats.forEach((f, i) => {
    const p = eBack(prog(l, 0.9 + i * 0.35, 0.6)), x = CX + (1 - i) * 560, y = 700;
    ctx.save(); ctx.translate(x, y); ctx.scale(p, p);
    ctx.fillStyle = "rgba(245,196,81,0.08)"; ctx.strokeStyle = C.gold; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(-230, -70, 460, 140, 70); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.gold; ctx.beginPath(); ctx.arc(-170, 0, 12, 0, 7); ctx.fill();
    text(f, 20, 4, { font: font(700, 52), color: C.white }); ctx.restore();
  });
}
function s4(t, l) { // 9.2-12 marquee finale
  room(t, 1);
  const a = prog(l, 0, 0.6); beam(t, 0.3 * a);
  const fy = 150, fh = 540;
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = C.gold; ctx.lineWidth = 8; ctx.strokeRect(CX - 700, 210, 1400, 560); ctx.restore();
  bulbs(t, CX - 700, 210, CX + 700, 210, 22, a); bulbs(t, CX - 700, 770, CX + 700, 770, 22, a);
  bulbs(t, CX - 700, 210, CX - 700, 770, 8, a); bulbs(t, CX + 700, 210, CX + 700, 770, 8, a);
  const s = eBack(prog(l, 0.3, 0.9)); ctx.save(); ctx.translate(CX, 410); ctx.scale(s, s);
  text("سينما", 0, 0, { font: font(900, 240), color: C.gold, glow: "rgba(245,196,81,0.7)", blur: 70, alpha: prog(l, 0.3, 0.3) }); ctx.restore();
  text("تجربة لا تُنسى", CX, 560, { font: font(700, 70), color: C.white, alpha: prog(l, 1.0, 0.6) });
  text("احجز مقعدك الآن", CX, 670, { font: font(400, 52), color: C.gold, alpha: prog(l, 1.5, 0.6) });
  ctx.save(); ctx.globalAlpha = prog(l, 1.8, 0.6); ctx.fillStyle = C.red; ctx.beginPath(); ctx.roundRect(CX - 220, 870, 440, 100, 50); ctx.fill();
  text("شاهد الآن", CX, 922, { font: font(900, 50), color: C.white }); ctx.restore();
}
function vignette(t) {
  const g = ctx.createRadialGradient(CX, CY, 400, CX, CY, 1150); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.65)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const r = rng(Math.floor(t * 24) + 1); ctx.fillStyle = "rgba(255,255,255,0.05)";
  for (let i = 0; i < 40; i++) ctx.fillRect(r() * W, r() * H, 2, 2);
  if (r() > 0.93) { ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(r() * W, 0, 2, H); }
}
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  if (t < 3.2) s1(t); else if (t < 6.2) s2(t, t - 3.2); else if (t < 9.2) s3(t, t - 6.2); else s4(t, t - 9.2);
  // fade in/out and flash cuts
  for (const c of [3.2, 6.2, 9.2]) { const d = t - c; if (d >= 0 && d < 0.25) { ctx.fillStyle = `rgba(255,246,229,${0.7 * (1 - d / 0.25)})`; ctx.fillRect(0, 0, W, H); } }
  vignette(t);
  const f = Math.max(1 - prog(t, 0, 0.5), prog(t, DURATION - 0.6, 0.6)); ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H);
}
window.DURATION = DURATION; window.render = render;
window.ready = Promise.all([400, 700, 900].flatMap(w => [document.fonts.load(`${w} 50px Cairo`, "سينما"), document.fonts.load(`${w} 50px Cairo`, "ABC")])).then(() => true);
if (!navigator.webdriver) { const t0 = performance.now(); window.ready.then(() => { const loop = n => { render(((n - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }); }
</script>
</body>
</html>
